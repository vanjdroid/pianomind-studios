// ── Metronome ──
let metroInterval = null;
let tapTimes = [];
let pendulumRaf = null;

function getTempoMarking(bpm) {
  if (bpm < 40) return 'Grave';
  if (bpm < 55) return 'Largo';
  if (bpm < 65) return 'Larghetto';
  if (bpm < 73) return 'Adagio';
  if (bpm < 86) return 'Andante';
  if (bpm < 98) return 'Moderato';
  if (bpm < 109) return 'Allegretto';
  if (bpm < 132) return 'Allegro';
  if (bpm < 168) return 'Vivace';
  if (bpm < 200) return 'Presto';
  return 'Prestissimo';
}

function startPendulum() {
  const arm = document.getElementById('pendulumArm');
  if (!arm) return;
  const dur = 60 / S.metroBpm;
  arm.style.animation = `pendulumSwing ${dur}s ease-in-out infinite alternate`;
}

function stopPendulum() {
  const arm = document.getElementById('pendulumArm');
  if (arm) arm.style.animation = 'none';
}

function metroClick(accent) {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  // Crisp woody tick — like a real metronome
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(accent ? 1500 : 1000, now);
  osc.frequency.exponentialRampToValueAtTime(accent ? 600 : 450, now + 0.025);
  g.gain.setValueAtTime(accent ? 0.6 : 0.4, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.04);
}

function metroTick() {
  const beats = parseInt(S.metroTimeSig);
  S.metroBeat = (S.metroBeat % beats) + 1;
  metroClick(S.metroBeat === 1);
  for (let b = 1; b <= beats; b++) {
    const el = document.getElementById('beat' + b);
    if (!el) continue;
    const on = b === S.metroBeat;
    el.style.background = on ? (b===1?'var(--accent)':'#c1c3ea') : 'rgba(255,255,255,0.3)';
    el.style.color = on ? '#fff' : '#6b7fa3';
    el.style.transform = on ? 'scale(1.2)' : 'scale(1)';
  }
}

function startMetro() {
  S.metroRunning = true; S.metroBeat = 0;
  getAudioCtx().resume();
  markGamePlayed('metronome');
  metroTick();
  metroInterval = setInterval(metroTick, 60000 / S.metroBpm);
  render('metronome');
  setTimeout(startPendulum, 50);
}

// Speed Demon achievement — metronome set above 180 BPM
function checkSpeedDemon() {
  if (S.metroBpm > 180) {
    const data = loadScores();
    if ((data._maxBpm || 0) < S.metroBpm) {
      data._maxBpm = S.metroBpm;
      try { localStorage.setItem('pms_scores', JSON.stringify(data)); } catch(e) {}
    }
    checkAchievements();
  }
}

function stopMetro() {
  S.metroRunning = false; S.metroBeat = 0;
  if (metroInterval) { clearInterval(metroInterval); metroInterval = null; }
  stopPendulum();
}

function toggleMetro() {
  if (S.metroRunning) { stopMetro(); render('metronome'); }
  else startMetro();
}

function adjustBpm(delta) {
  S.metroBpm = Math.max(30, Math.min(240, S.metroBpm + delta));
  if (S.metroRunning) {
    clearInterval(metroInterval);
    metroInterval = setInterval(metroTick, 60000 / S.metroBpm);
    startPendulum();
  }
  const disp = document.querySelector('[style*="font-size:3.5rem"]');
  if (disp) disp.textContent = S.metroBpm;
  // Update tempo marking
  const mark = document.querySelector('[style*="font-style:italic"]');
  if (mark) mark.textContent = getTempoMarking(S.metroBpm);
  checkSpeedDemon();
}

function changeTimeSig(ts) {
  S.metroTimeSig = ts;
  if (S.metroRunning) { stopMetro(); startMetro(); }
  else render('metronome');
}

function tapTempo() {
  const now = Date.now();
  if (tapTimes.length && now - tapTimes[tapTimes.length-1] > 2000) tapTimes = [];
  tapTimes.push(now);
  if (tapTimes.length > 6) tapTimes.shift();
  if (tapTimes.length >= 2) {
    let sum = 0;
    for (let i = 1; i < tapTimes.length; i++) sum += tapTimes[i] - tapTimes[i-1];
    const avg = sum / (tapTimes.length - 1);
    S.metroBpm = Math.max(30, Math.min(240, Math.round(60000 / avg)));
    if (S.metroRunning) { clearInterval(metroInterval); metroInterval = setInterval(metroTick, 60000 / S.metroBpm); }
    checkSpeedDemon();
    render('metronome');
  }
}

// ── Rhythm Training ──
let rhythmTimers = [];
function clearRhythmTimers() { rhythmTimers.forEach(id => clearTimeout(id)); rhythmTimers = []; }

function generateRhythmPattern(levelKey) {
  const level = RHYTHM_LEVELS[levelKey];
  let remaining = level.beats;
  const pattern = [];
  let guard = 0;
  while (remaining > 0.001 && guard < 50) {
    guard++;
    const avail = level.types.filter(t => RHYTHM_NOTE_TYPES[t].beats <= remaining + 0.001);
    const type = avail.length ? pick(avail) : level.types[0];
    pattern.push(type);
    remaining = Math.round((remaining - RHYTHM_NOTE_TYPES[type].beats) * 1000) / 1000;
  }
  return pattern;
}

function rhythmOnsets(pattern, bpm) {
  const msPerBeat = 60000 / bpm;
  let t = 0;
  return pattern.map(type => { const onset = t; t += RHYTHM_NOTE_TYPES[type].beats * msPerBeat; return onset; });
}

function startRhythmLevel(levelKey) {
  clearRhythmTimers();
  S.rhythmLevel = levelKey;
  S.rhythmPattern = generateRhythmPattern(levelKey);
  S.rhythmBpm = RHYTHM_LEVELS[levelKey].bpm;
  S.rhythmTaps = [];
  S.rhythmPhase = 'listen';
  S.rhythmResults = [];
  markGamePlayed('rhythm');
  render('rhythm_play');
}

function playRhythmPattern() {
  clearRhythmTimers();
  getAudioCtx().resume();
  const onsets = rhythmOnsets(S.rhythmPattern, S.rhythmBpm);
  onsets.forEach((onset, i) => {
    const id = setTimeout(() => {
      if (S.rhythmPattern[i] !== 'rest') metroClick(i === 0);
      const els = document.querySelectorAll('.rhythm-note');
      els.forEach((el, j) => el.classList.toggle('current', j === i));
    }, onset);
    rhythmTimers.push(id);
  });
  const lastType = S.rhythmPattern[S.rhythmPattern.length - 1];
  const totalDur = onsets.length ? onsets[onsets.length-1] + RHYTHM_NOTE_TYPES[lastType].beats * (60000 / S.rhythmBpm) : 0;
  const doneId = setTimeout(() => {
    document.querySelectorAll('.rhythm-note').forEach(el => el.classList.remove('current'));
  }, totalDur + 50);
  rhythmTimers.push(doneId);
}

function rhythmStartTapping() {
  clearRhythmTimers();
  getAudioCtx().resume();
  S.rhythmPhase = 'tap';
  S.rhythmTaps = [];
  S.rhythmStartTime = null;
  render('rhythm_play');
  const msPerBeat = 60000 / S.rhythmBpm;
  for (let b = 0; b < 4; b++) {
    const id = setTimeout(() => metroClick(b === 0), b * msPerBeat);
    rhythmTimers.push(id);
  }
  const goId = setTimeout(() => {
    S.rhythmStartTime = performance.now();
    const cue = $('rhythmCue');
    if (cue) cue.textContent = 'GO! Tap the rhythm!';
  }, 4 * msPerBeat);
  rhythmTimers.push(goId);
  // Safety timeout — auto-finish if not enough taps come in
  const onsets = rhythmOnsets(S.rhythmPattern, S.rhythmBpm);
  const lastType = S.rhythmPattern[S.rhythmPattern.length - 1];
  const patternDur = onsets.length ? onsets[onsets.length-1] + RHYTHM_NOTE_TYPES[lastType].beats * msPerBeat : 0;
  const finishId = setTimeout(() => { if (S.rhythmPhase === 'tap') finishRhythmRound(); }, 4 * msPerBeat + patternDur + 1200);
  rhythmTimers.push(finishId);
}

function rhythmTap() {
  if (S.rhythmPhase !== 'tap' || S.rhythmStartTime == null) return;
  const t = performance.now() - S.rhythmStartTime;
  S.rhythmTaps.push(t);
  metroClick(false);
  const tapTarget = S.rhythmPattern.filter(t => t !== 'rest').length;
  const cue = $('rhythmTapCount');
  if (cue) cue.textContent = S.rhythmTaps.length + ' / ' + tapTarget + ' taps';
  if (S.rhythmTaps.length >= tapTarget) {
    setTimeout(finishRhythmRound, 200);
  }
}

function finishRhythmRound() {
  if (S.rhythmPhase !== 'tap') return;
  clearRhythmTimers();
  const onsets = rhythmOnsets(S.rhythmPattern, S.rhythmBpm);
  // Filter out rest notes — rests are auto-correct (player shouldn't tap)
  let tapIdx = 0;
  const results = onsets.map((onset, i) => {
    if (S.rhythmPattern[i] === 'rest') return { hit: true, rating: 'perfect' };
    if (S.rhythmTaps[tapIdx] == null) return { hit: false, rating: 'miss' };
    const err = Math.abs(S.rhythmTaps[tapIdx] - onset);
    tapIdx++;
    let rating = 'miss';
    if (err <= 100) rating = 'perfect';
    else if (err <= 200) rating = 'good';
    else if (err <= 300) rating = 'ok';
    return { hit: rating !== 'miss', rating: rating, err: err };
  });
  S.rhythmResults = results;
  const hitCount = results.filter(r => r.hit).length;
  S.rhythmScore = hitCount;
  S.rhythmTotal = results.length;
  const xpEarned = hitCount * 10 + 25 + (hitCount === results.length ? 50 : 0);
  addXP(xpEarned);
  saveScore('rhythm', S.rhythmLevel, hitCount, results.length);
  checkAchievements();
  S.rhythmPhase = 'result';
  render('rhythm_play');
}

function answerTheoryQuiz(choice) {
  const lesson = THEORY_LESSONS.find(l => l.id === S.theoryLesson);
  const q = lesson.quiz[S.theoryQIdx];
  if (choice === q.answer) { S.theoryScore++; S.theoryFeedback = 'correct'; addXP(10); sfxCorrect(); }
  else { S.theoryFeedback = 'wrong'; sfxWrong(); }
  render('theory_lesson');
}
function nextTheoryQuestion() {
  const lesson = THEORY_LESSONS.find(l => l.id === S.theoryLesson);
  S.theoryQIdx++;
  S.theoryFeedback = null;
  if (S.theoryQIdx >= lesson.quiz.length) {
    addXP(25);
    if (S.theoryScore === lesson.quiz.length) addXP(50);
    const result = saveTheoryResult(lesson.id, S.theoryScore, lesson.quiz.length);
    S.theoryPhase = 'result';
    if (result.isNewPass) {
      const data = loadScores();
      data._theoryPassedCount = (data._theoryPassedCount || 0) + 1;
      try { localStorage.setItem('pms_scores', JSON.stringify(data)); } catch(e) {}
      checkAchievements();
    }
  }
  render('theory_lesson');
}

  const id = localStorage.getItem('pms_theme') || 'default';
  const t = APP_THEMES[id];
  if (getMode() !== 'cartoon') return;
  document.body.style.backgroundColor = t.bg;
  document.body.style.backgroundImage = `url('${t.img}')`;
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--card-bg', t.card);
  const btnStyle = document.getElementById('themeBtnStyle');
  if (btnStyle) btnStyle.remove();
  if (id !== 'default') {
    const s = document.createElement('style');
    s.id = 'themeBtnStyle';
    s.textContent = `.btn-lilac { background: ${t.accent}44; } .btn-blue { background: ${t.bg}; }`;

  }

const SNOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const SDUR={w:4,h:2,dh:3,q:1,dq:1.5,e:0.5,s:0.25};
function parseSong(str){
  return str.trim().split(/\s+/).map(t=>{
    const m=t.match(/^([A-G])([#b]?)(\d)(w|dh|h|dq|q|e|s)?$/);
    if(!m)return null;
    let n=SNOTE[m[1]]+(parseInt(m[3])-4)*12-9;
    if(m[2]==='#')n++;if(m[2]==='b')n--;
    return{n,dur:SDUR[m[4]||'q'],name:m[1]+m[2]+m[3],hit:false,missed:false,h:noteNumToHeight(n)};
  }).filter(Boolean);
}

// ═══════════════════════════════════
//  SIGHT-READING MODE
// ═══════════════════════════════════

const SIGHTREAD_LEVELS = {
  easy:   { label:'Easy',   range:[-9,-2],  accidentals:false, noteCount:8,  bpm:60  },
  medium: { label:'Medium', range:[-9,3],   accidentals:false, noteCount:12, bpm:70  },
  hard:   { label:'Hard',   range:[-9,7],   accidentals:true,  noteCount:16, bpm:80  },
  expert: { label:'Expert', range:[-9,14],  accidentals:true,  noteCount:20, bpm:90  },
};

function noteNumToName(n) {
  const pc = ((n + 9) % 12 + 12) % 12;
  return SHARP_NAMES[pc];
}
function noteNumToHeight(n) {
  // Map note number to treble clef staff height
  const BASE = { C:-1, D:-0.5, E:0, F:0.5, G:1, A:1.5, B:2 };
  const pc = ((n + 9) % 12 + 12) % 12;
  const letter = SHARP_NAMES[pc].charAt(0);
  const octave = Math.floor((n + 9) / 12) + 4;
  return (BASE[letter] || 0) + (octave - 4) * 3.5;
}

function generateSightReadNotes(levelKey) {
  const lvl = SIGHTREAD_LEVELS[levelKey];
  const notes = [];
  const whiteOnly = PIANO_WHITE.filter(k => k.n >= lvl.range[0] && k.n <= lvl.range[1]);
  const pool = lvl.accidentals ? [...whiteOnly, ...PIANO_BLACK.filter(k => k.n >= lvl.range[0] && k.n <= lvl.range[1])] : whiteOnly;
  for (let i = 0; i < lvl.noteCount; i++) {
    const note = pick(pool);
    notes.push({ n: note.n, name: note.name, h: noteNumToHeight(note.n), hit: false, missed: false });
  }
  return notes;
}

let sightReadMicStream = null, sightReadAnalyser = null, sightReadSource = null;
let sightReadRaf = null, sightReadStablePc = -1, sightReadStableCount = 0;
let sightReadScrollStart = 0;

function startSightReading() {
  const ctx = getAudioCtx();
  ctx.resume();
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    sightReadMicStream = stream;
    sightReadSource = ctx.createMediaStreamSource(stream);
    sightReadAnalyser = ctx.createAnalyser();
    sightReadAnalyser.fftSize = 2048;
    sightReadSource.connect(sightReadAnalyser);
    S.sightReadPlaying = true;
    S.sightReadIdx = 0;
    S.sightReadScore = 0;
    S.sightReadDone = false;
    sightReadStablePc = -1; sightReadStableCount = 0;
    sightReadScrollStart = performance.now();
    markGamePlayed('sightread');
    if (S.songPlayPage) render('song_play');
    else render('sightread_play');
    sightReadLoop();
  }).catch(function() {
    alert('Microphone access is needed for sight-reading!');
  });
}

function stopSightReading() {
  S.sightReadPlaying = false;
  if (sightReadMicStream) { sightReadMicStream.getTracks().forEach(t => t.stop()); sightReadMicStream = null; }
  if (sightReadSource) { sightReadSource.disconnect(); sightReadSource = null; }
  sightReadAnalyser = null;
  if (sightReadRaf) { cancelAnimationFrame(sightReadRaf); sightReadRaf = null; }
}

function sightReadLoop() {
  if (!S.sightReadPlaying || !sightReadAnalyser) return;

  // Pitch detection
  const buf = new Float32Array(sightReadAnalyser.fftSize);
  sightReadAnalyser.getFloatTimeDomainData(buf);
  const freq = autoCorrelate(buf, getAudioCtx().sampleRate);

  if (freq > 60 && freq < 1500 && S.sightReadIdx < S.sightReadNotes.length) {
    const noteNum = Math.round(12 * Math.log2(freq / 440));
    const pc = ((noteNum + 9) % 12 + 12) % 12;
    if (pc === sightReadStablePc) sightReadStableCount++;
    else { sightReadStablePc = pc; sightReadStableCount = 1; }

    if (sightReadStableCount === 3) {
      const target = S.sightReadNotes[S.sightReadIdx];
      const targetPc = ((target.n + 9) % 12 + 12) % 12;
      if (pc === targetPc) {
        target.hit = true;
        S.sightReadScore++;
        S.sightReadIdx++;
        sightReadStablePc = -1; sightReadStableCount = 0;
        sfxCorrect();
        if (S.sightReadIdx >= S.sightReadNotes.length) {
          finishSightReading();
          return;
        }
      }
    }
  }

  // Auto-advance: if time runs out on a note, mark it missed
  const lvl = SIGHTREAD_LEVELS[S.sightReadLevel];
  const msPerNote = 60000 / lvl.bpm;
  const elapsed = performance.now() - sightReadScrollStart;
  const expectedIdx = Math.floor(elapsed / msPerNote);
  while (S.sightReadIdx < expectedIdx && S.sightReadIdx < S.sightReadNotes.length) {
    if (!S.sightReadNotes[S.sightReadIdx].hit) {
      S.sightReadNotes[S.sightReadIdx].missed = true;
    }
    S.sightReadIdx++;
  }
  if (S.sightReadIdx >= S.sightReadNotes.length) { finishSightReading(); return; }

  // Draw the scrolling staff
  drawSightReadStaff();

  sightReadRaf = requestAnimationFrame(sightReadLoop);
}

function drawSightReadStaff() {
  const c = document.getElementById('sightReadCanvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#d4e8fc';
  ctx.fillRect(0, 0, W, H);

  const LS = 20;
  const bottomLine = H * 0.65;
  function yOf(h) { return bottomLine - h * LS; }

  // Staff lines
  ctx.strokeStyle = '#3a5a7a'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const y = yOf(i);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // "Now" line
  const nowX = 60;
  ctx.strokeStyle = 'rgba(124,111,239,0.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(nowX, 20); ctx.lineTo(nowX, H - 20); ctx.stroke();
  ctx.setLineDash([]);

  // Notes
  const lvl = SIGHTREAD_LEVELS[S.sightReadLevel];
  const msPerNote = 60000 / lvl.bpm;
  const elapsed = performance.now() - sightReadScrollStart;
  const pxPerMs = 0.15;

  S.sightReadNotes.forEach((note, i) => {
    const noteTime = i * msPerNote;
    const x = nowX + (noteTime - elapsed) * pxPerMs;
    if (x < -30 || x > W + 30) return;

    const y = yOf(note.h);

    // Ledger lines
    ctx.strokeStyle = '#3a5a7a'; ctx.lineWidth = 1.5;
    for (let l = -1; note.h <= l; l--) { const ly = yOf(l); ctx.beginPath(); ctx.moveTo(x-14,ly); ctx.lineTo(x+14,ly); ctx.stroke(); }
    for (let l = 5; note.h >= l; l++) { const ly = yOf(l); ctx.beginPath(); ctx.moveTo(x-14,ly); ctx.lineTo(x+14,ly); ctx.stroke(); }

    // Color
    let color = '#1a2a3a';
    if (note.hit) color = '#4CAF50';
    else if (note.missed) color = '#e53935';
    else if (i === S.sightReadIdx) color = '#7c6fef';

    // Note head
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(x, y, 9, 7, -0.15, 0, Math.PI * 2); ctx.fill();

    // Note name below
    ctx.fillStyle = color;
    ctx.font = '600 10px Quicksand';
    ctx.textAlign = 'center';
    ctx.fillText(note.name, x, H - 8);
  });

  // Current target label
  if (S.sightReadIdx < S.sightReadNotes.length) {
    const target = S.sightReadNotes[S.sightReadIdx];
    ctx.fillStyle = '#7c6fef';
    ctx.font = '700 14px Quicksand';
    ctx.textAlign = 'left';
    ctx.fillText('Play: ' + target.name, 10, 18);
  }

  // Score
  ctx.fillStyle = '#0f2744';
  ctx.font = '700 13px Quicksand';
  ctx.textAlign = 'right';
  ctx.fillText(S.sightReadScore + '/' + S.sightReadNotes.length, W - 10, 18);
}

function finishSightReading() {
  stopSightReading();
  S.sightReadTotal = S.sightReadNotes.length;
  S.sightReadDone = true;
  const xpEarned = S.sightReadScore * 10 + 25 + (S.sightReadScore === S.sightReadTotal ? 50 : 0);
  addXP(xpEarned);
  saveScore('sightread', S.sightReadLevel, S.sightReadScore, S.sightReadTotal);
  checkAchievements();
  if (S.sightReadScore === S.sightReadTotal) confetti();
  if (S.songPlayPage) render('song_play');
  else render('sightread_play');
}

// ── Start ──
applyMode();
render('welcome');
</script>
</body>
</html>
