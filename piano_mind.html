<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Mind Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --accent: #7c6fef;
  --card-bg: rgba(255,255,255,0.35);
}

body {
  font-family: 'Quicksand', sans-serif;
  background-color: #a2cafb;
  background-image: url('background.png?v=2');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  min-height: 100vh;
  color: #1a2a3a;
  display: flex;
  justify-content: center;
}

#app {
  max-width: 520px;
  width: 100%;
  padding: 10rem 1.2rem 4rem;
}

/* ── Page transitions ── */
.page { animation: fadeIn 0.35s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Welcome screen ── */
.welcome-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  animation: fadeIn 0.6s ease;
  margin-top: 0;
  padding-top: 1rem;
}
.welcome-card {
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 32px;
  padding: 2rem 2.2rem 2.2rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  animation: welcomeFloat 3s ease-in-out infinite;
}
@keyframes welcomeFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.welcome-pebbles {
  animation: welcomeBounce 1.5s ease-in-out infinite;
}
@keyframes welcomeBounce {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-10px) rotate(2deg); }
}
.welcome-title {
  font-size: 2.2rem;
  font-weight: 700;
  color: #0f2744;
  margin: 0.6rem 0 0.1rem;
  text-shadow: 0 2px 8px rgba(0,0,0,0.08);
  line-height: 1.2;
}
.welcome-notes {
  font-size: 1.6rem;
  margin: 0.3rem 0;
  letter-spacing: 0.3rem;
  animation: notesDrift 4s ease-in-out infinite;
}
@keyframes notesDrift {
  0%, 100% { transform: translateX(0); opacity: 0.7; }
  50% { transform: translateX(6px); opacity: 1; }
}
.welcome-sub {
  font-size: 1rem;
  font-weight: 600;
  color: #2c5f8a;
  margin-bottom: 1.2rem;
}
.welcome-play {
  display: inline-block;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  font-size: 1.8rem;
  padding: 1.2rem 4.5rem;
  margin-top: 1.5rem;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  background: linear-gradient(135deg, #b2ebd8, #a2cafb, #c1c3ea);
  color: #0f2744;
  box-shadow: 0 6px 24px rgba(124,111,239,0.25);
  transition: all 0.25s ease;
  animation: playPulse 2s ease-in-out infinite;
}
.welcome-play:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 30px rgba(124,111,239,0.35);
}
.welcome-play:active { transform: scale(0.96); animation: none; }
@keyframes playPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 6px 24px rgba(124,111,239,0.25); }
  50% { transform: scale(1.05); box-shadow: 0 8px 30px rgba(124,111,239,0.35); }
}

/* ── Title ── */
h1 {
  font-size: 2rem;
  font-weight: 700;
  color: #0f2744;
  margin-bottom: 0.6rem;
}

/* ── Pebbles image ── */
.pebbles {
  display: block;
  margin: 0.5rem auto;
  background: rgba(255,255,255,0.85);
  border-radius: 22%;
  padding: 4px;
}

/* ── Glass card ── */
.card {
  background: var(--card-bg, rgba(255,255,255,0.35));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 22px;
  padding: 1.4rem;
  margin: 0.8rem 0;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

/* ── Speech bubble ── */
.speech {
  font-size: 1.05rem;
  line-height: 1.55;
  margin: 0.5rem 0;
  font-weight: 500;
}
.speech strong { color: #0f2744; }

/* ── Buttons ── */
.btn {
  display: inline-block;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  font-size: 1.05rem;
  padding: 0.75rem 1.6rem;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.10);
  transition: all 0.2s ease;
  letter-spacing: 0.3px;
  color: #2c3e50;
}
.btn:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}
.btn:active { transform: scale(0.97); }

.btn-lilac   { background: #c1c3ea; }
.btn-blue    { background: #a2cafb; }
.btn-mint    { background: #b2ebd8; }
.btn-coral   { background: #f7b0a6; }
.btn-pink    { background: #e1bcd8; }
.btn-wide    { width: 100%; text-align: center; }

.btn-row {
  display: flex;
  gap: 0.7rem;
  margin: 0.8rem 0;
}
.btn-row .btn { flex: 1; text-align: center; }

/* ── Text input ── */
.input-wrap { margin: 0.8rem 0; }
.input-wrap label {
  display: block;
  font-weight: 700;
  font-size: 0.95rem;
  margin-bottom: 0.3rem;
}
.input-wrap input {
  width: 100%;
  font-family: 'Quicksand', sans-serif;
  font-size: 1.05rem;
  padding: 0.65rem 1rem;
  border: 2px solid rgba(193,195,234,0.6);
  border-radius: 18px;
  background: rgba(255,255,255,0.5);
  color: #1a2a3a;
  outline: none;
  transition: all 0.2s ease;
}
.input-wrap input:focus {
  border-color: #a5a7d4;
  background: rgba(255,255,255,0.75);
  box-shadow: 0 0 14px rgba(193,195,234,0.4);
}

/* ── Progress bar ── */
.progress-wrap {
  height: 10px;
  background: rgba(255,255,255,0.3);
  border-radius: 10px;
  margin: 0.6rem 0 1rem;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 10px;
  background: linear-gradient(90deg, #b2ebd8, #a2cafb, #c1c3ea, #e1bcd8);
  transition: width 0.4s ease;
}

/* ── Alert boxes ── */
.alert {
  border-radius: 18px;
  padding: 1rem 1.2rem;
  margin: 0.6rem 0;
  font-weight: 600;
  font-size: 1rem;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.3);
}
.alert-success { background: rgba(178,235,216,0.6); }
.alert-warning { background: rgba(247,176,166,0.5); }
.alert-error   { background: rgba(247,176,166,0.7); }

/* ── Caption ── */
.caption {
  font-size: 0.82rem;
  color: #6b7fa3;
  margin: 0.4rem 0;
}

/* ── Round selector ── */
.round-picker {
  display: flex;
  gap: 0.4rem;
  margin: 0.6rem 0;
}
.round-opt {
  flex: 1;
  padding: 0.5rem;
  border: 2px solid rgba(193,195,234,0.4);
  border-radius: 14px;
  background: rgba(255,255,255,0.25);
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s ease;
  color: #2c3e50;
}
.round-opt:hover { background: rgba(255,255,255,0.45); }
.round-opt.active {
  background: #c1c3ea;
  border-color: #a5a7d4;
}

/* ── Staff canvas ── */
canvas {
  display: block;
  margin: 0.5rem auto;
  border-radius: 14px;
}

/* ── Play button (audio) ── */
.play-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  background: rgba(255,255,255,0.4);
  border: 2px solid rgba(193,195,234,0.5);
  border-radius: 16px;
  padding: 0.6rem 1.2rem;
  cursor: pointer;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  color: #2c3e50;
  margin: 0.5rem auto;
  transition: all 0.2s ease;
}
.play-btn:hover {
  background: rgba(255,255,255,0.6);
  transform: scale(1.03);
}

/* ── Score display ── */
.score-big {
  font-size: 2.5rem;
  font-weight: 700;
  text-align: center;
  color: #0f2744;
  margin: 0.8rem 0;
}

/* ── Confetti ── */
.confetti-piece {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  animation: confettiFall 3s ease-out forwards;
  pointer-events: none;
  z-index: 999;
}
@keyframes confettiFall {
  0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}

/* ── Piano keyboard ── */
.piano-wrap {
  position: relative;
  display: flex;
  margin: 0.8rem auto;
  border-radius: 0 0 10px 10px;
  overflow: visible;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  width: fit-content;
}
.p-white {
  width: 30px; height: 120px;
  background: linear-gradient(to bottom, #f8f8f8, #fff);
  border: 1px solid #bbb;
  border-radius: 0 0 6px 6px;
  cursor: pointer;
  position: relative; z-index: 1;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 6px;
  font-size: 0.6rem; font-weight: 700; color: #aaa;
  transition: background 0.08s;
  user-select: none;
}
.p-white:active { background: linear-gradient(to bottom, #d5c8e8, #e8e0f0); }
.p-hl { background: linear-gradient(to bottom, #c1c3ea, #d5c8e8) !important; }
.p-black {
  width: 20px; height: 76px;
  background: linear-gradient(to bottom, #2a3a4a, #1a2a3a);
  border-radius: 0 0 4px 4px;
  cursor: pointer;
  position: absolute; top: 0; z-index: 2;
  transition: background 0.08s;
  user-select: none;
}
.p-black:active { background: linear-gradient(to bottom, #5a6a7a, #4a5a6a); }
.p-bk-hl { background: linear-gradient(to bottom, var(--accent), #5a4fcf) !important; }
.bk-lbl { font-size:7px; color:#fff; text-align:center; pointer-events:none;
  position:absolute; bottom:4px; left:0; right:0; line-height:1.2; opacity:0.85; }
.note-display {
  text-align: center;
  font-size: 2rem; font-weight: 700;
  color: #0f2744;
  min-height: 3rem;
  margin: 0.3rem 0;
}

/* ── Choice grid (interval game) ── */
.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
  margin: 0.6rem 0;
}
.choice-grid .btn { width: 100%; text-align: center; font-size: 0.95rem; padding: 0.65rem 0.5rem; }

/* Stats */
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; margin:0.6rem 0; }
.stat-card { background:rgba(255,255,255,0.4); border-radius:16px; padding:0.8rem; text-align:center; }
.stat-num { font-size:1.8rem; font-weight:700; color:#0f2744; }
.stat-label { font-size:0.78rem; color:#6b7fa3; font-weight:600; }
/* Wardrobe */
.outfit-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; margin:0.6rem 0; }
.outfit-card { background:rgba(255,255,255,0.3); border-radius:16px; padding:0.6rem; text-align:center;
  cursor:pointer; border:2px solid transparent; transition:all 0.2s; }
.outfit-card:hover { background:rgba(255,255,255,0.5); }
.outfit-card.active { border-color:#c1c3ea; background:rgba(193,195,234,0.3); }
.outfit-name { font-size:0.8rem; font-weight:700; margin-top:0.3rem; }
/* Best badge */
.best-badge { display:inline-block; background:rgba(255,215,0,0.3); border-radius:12px;
  padding:0.2rem 0.7rem; font-size:0.78rem; font-weight:700; margin:0.3rem 0; }
/* Score list */
.score-row { display:flex; justify-content:space-between; padding:0.3rem 0; border-bottom:1px solid rgba(0,0,0,0.06); }
.score-row:last-child { border:none; }
/* Scale staff wrong-note wiggle */
@keyframes staffWiggle {
  0%,100% { transform:translateX(0); }
  20% { transform:translateX(-5px) rotate(-1deg); }
  40% { transform:translateX(4px) rotate(1deg); }
  60% { transform:translateX(-3px) rotate(-0.5deg); }
  80% { transform:translateX(2px) rotate(0.5deg); }
}
.staff-wiggle { animation: staffWiggle 0.4s ease; }
@keyframes pendulumSwing {
  0% { transform: rotate(-30deg); }
  100% { transform: rotate(30deg); }
}

/* ── XP / Level bar ── */
.xp-card { padding: 0.9rem 1rem; }
.xp-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem; }
.xp-level { font-weight:700; color:#0f2744; font-size:1.05rem; }
.xp-amount { font-size:0.78rem; color:#6b7fa3; font-weight:600; }
.xp-total { text-align:center; font-size:0.78rem; color:#6b7fa3; font-weight:600; margin-top:0.3rem; }

/* ── Section labels (home tabs, settings) ── */
.section-label { font-size:0.75rem; font-weight:700; color:#6b7fa3; text-transform:uppercase; letter-spacing:1.5px; margin:0.8rem 0 0.2rem 0.3rem; }

/* ── Home page tabs ── */
.home-tabs { display:flex; gap:0; margin:0.6rem 0; background:rgba(255,255,255,0.25); border-radius:18px; padding:3px; }
.home-tab { flex:1; text-align:center; padding:0.5rem 0.3rem; border-radius:15px; font-weight:700; font-size:0.8rem; cursor:pointer; transition:all 0.2s; color:#6b7fa3; }
.home-tab.active { background:rgba(255,255,255,0.7); color:#0f2744; box-shadow:0 2px 8px rgba(0,0,0,0.08); }

/* ── Pulse for active-streak button ── */
@keyframes pulseBtn {
  0%, 100% { box-shadow: 0 4px 14px rgba(0,0,0,0.10); }
  50% { box-shadow: 0 4px 22px rgba(124,111,239,0.6); }
}
.pulse-btn { animation: pulseBtn 1.4s ease-in-out infinite; }

/* ── Achievements grid ── */
.ach-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.5rem; margin:0.5rem 0; }
.ach-card { background:rgba(255,255,255,0.3); border-radius:14px; padding:0.6rem 0.4rem; text-align:center; transition:all 0.2s; }
.ach-card:hover { transform:scale(1.05); }
.ach-card.locked { opacity:0.5; filter:grayscale(0.8); }
.ach-icon { font-size:1.6rem; }
.ach-name { font-size:0.7rem; font-weight:700; margin-top:0.2rem; }
.ach-desc { font-size:0.6rem; color:#6b7fa3; }

/* ── Rhythm training ── */
.rhythm-staff { display:flex; justify-content:center; align-items:flex-end; gap:0.7rem; flex-wrap:wrap; min-height:70px; margin:0.6rem 0; }
.rhythm-note { font-size:2.6rem; color:#0f2744; transition:all 0.15s ease; }
.rhythm-note.current { color:var(--accent); transform:scale(1.3); }

/* ── Theory lesson cards ── */
.theory-card { cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.theory-card:hover { transform:scale(1.02); box-shadow:0 4px 20px rgba(124,111,239,0.15); }

/* ── Gradient title ── */
h1 {
  background: linear-gradient(135deg, #0f2744, var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── Card hover glow + staggered entrance ── */
.card { transition: all 0.3s ease; animation: slideUp 0.4s ease backwards; }
.card:hover { box-shadow: 0 6px 30px rgba(124,111,239,0.15); }
.card:nth-child(2) { animation-delay: 0.1s; }
.card:nth-child(3) { animation-delay: 0.2s; }
@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

/* ── Shimmer progress bar ── */
@keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
.progress-fill { background-size: 200% 100%; animation: shimmer 3s linear infinite; }

/* ── Achievement / level-up toast ── */
@keyframes toastIn { from { transform:translateY(100px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.achievement-toast {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:rgba(124,111,239,0.95); color:#fff; padding:0.8rem 1.4rem;
  border-radius:20px; font-weight:700; font-size:0.95rem; z-index:1000;
  animation:toastIn 0.4s ease; backdrop-filter:blur(10px);
  box-shadow:0 8px 30px rgba(124,111,239,0.3);
  max-width: 90vw; text-align:center;
}
.levelup-toast {
  bottom: 96px;
  background: linear-gradient(135deg, #ffd76a, #ff9f5a);
  box-shadow: 0 8px 30px rgba(255,159,90,0.4);
}

/* ── Settings theme card ── */
.theme-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin:0.5rem 0; }
.theme-card { border-radius:16px; padding:0.7rem; text-align:center; cursor:pointer; border:2px solid transparent; transition:all 0.2s; }
.theme-card:hover { transform:scale(1.03); }
.theme-card.active { border-color:var(--accent, #7c6fef); box-shadow:0 0 0 3px rgba(124,111,239,0.2); }
.theme-swatch { width:36px; height:36px; border-radius:50%; margin:0 auto 0.3rem; border:2px solid rgba(255,255,255,0.5); }
.theme-name { font-size:0.8rem; font-weight:700; }

/* ═══════════════════════════════
   MODE: SMOOTH
   ═══════════════════════════════ */
body.mode-smooth {
  background-color: #f0f0f0;
  background-image: url('bg_smooth.png');
  color: #333;
}
body.mode-smooth h1 { color: #444; }
body.mode-smooth .card {
  background: rgba(255,255,255,0.8);
  border: 1px solid #ddd;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
body.mode-smooth .speech { color: #555; }
body.mode-smooth .speech strong { color: #333; }
body.mode-smooth .btn {
  background: #f0f0f0 !important;
  color: #333 !important;
  border: 1px solid #ccc !important;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
body.mode-smooth .btn:hover {
  background: #e4e4e4 !important;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}
body.mode-smooth .welcome-card {
  background: rgba(255,255,255,0.85);
  border: 1px solid #ddd;
}
body.mode-smooth .welcome-play {
  background: linear-gradient(135deg, #e8e8e8, #ddd, #e0e0e0) !important;
  color: #333 !important;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
body.mode-smooth .welcome-title { color: #444; }
body.mode-smooth .welcome-sub { color: #666; }
body.mode-smooth .play-btn {
  background: rgba(255,255,255,0.7) !important;
  color: #333 !important;
  border: 1px solid #ccc !important;
}
body.mode-smooth .progress-fill { background: #999 !important; }
body.mode-smooth .round-opt { background: rgba(255,255,255,0.7); color: #444; border: 1px solid #ccc; }
body.mode-smooth .round-opt.active { background: #ddd; border-color: #999; }
body.mode-smooth .alert-success { background: rgba(200,230,200,0.6); }
body.mode-smooth .alert-warning { background: rgba(240,220,200,0.5); }
body.mode-smooth .alert-error { background: rgba(240,200,200,0.6); }
body.mode-smooth .section-label { color: #555; }
body.mode-smooth .pebbles { display: none; }
body.mode-smooth .welcome-pebbles { display: none; }

/* ═══════════════════════════════
   MODE: NEON
   ═══════════════════════════════ */
body.mode-neon {
  background-color: #0a0a0a;
  background-image: url('bg_neon.png');
  color: #e0e0e0;
}
body.mode-neon h1 { color: #e0e0e0; text-shadow: 0 0 20px rgba(0,200,255,0.4); }
body.mode-neon .card {
  background: rgba(12,12,12,0.9);
  border: 1px solid rgba(0,200,255,0.35);
  box-shadow: 0 0 25px rgba(0,200,255,0.12), inset 0 0 15px rgba(0,200,255,0.03);
}
body.mode-neon .speech { color: #ccc; }
body.mode-neon .speech strong { color: #e0e0e0; }
body.mode-neon .btn {
  background: #0e0e0e !important;
  color: #e0e0e0 !important;
  border: 1px solid rgba(0,200,255,0.45) !important;
  box-shadow: 0 0 16px rgba(0,200,255,0.2), inset 0 0 8px rgba(0,200,255,0.05);
  text-shadow: 0 0 8px rgba(0,200,255,0.3);
  transition: all 0.2s ease;
}
body.mode-neon .btn:hover {
  background: #151515 !important;
  box-shadow: 0 0 30px rgba(0,200,255,0.4), inset 0 0 12px rgba(0,200,255,0.08);
  border-color: rgba(0,200,255,0.6) !important;

function chordNameSteps(semi) {
  if (semi === 0) return 0;
  if (semi >= 3 && semi <= 4) return 2;
  if (semi >= 6 && semi <= 8) return 4;
  if (semi >= 10 && semi <= 11) return 6;
  return 0;
}

function getChordStaffInfo(rootName, chordType, clef) {
  const intervals = CHORD_INTERVALS[chordType];
  const rootIdx = NOTE_ORDER_C.indexOf(rootName);
  const rootSemi = NOTE_SEMI_C[rootName];
  const rootH = (clef === 'treble' ? TREBLE_CHORD_H : BASS_CHORD_H)[rootName];
  const heights = [], accidentals = [];
  intervals.forEach(semi => {
    const steps = chordNameSteps(semi);
    heights.push(rootH + steps * 0.5);
    const noteName = NOTE_ORDER_C[(rootIdx + steps) % 7];
    const naturalSemi = NOTE_SEMI_C[noteName];
    const targetSemi = (rootSemi + semi) % 12;
    const diff = ((targetSemi - naturalSemi) + 12) % 12;
    let acc = 'natural';
    if (diff === 1) acc = 'sharp';
    else if (diff === 11) acc = 'flat';
    accidentals.push(acc);
  });
  return { heights, accidentals };
}

    const acc = name.length > 1 ? (name.charAt(1) === '#' ? 'sharp' : 'flat') : 'natural';
    const letterIdx = letterOrder.indexOf(letter);
    let oct = rootOct;
    if (i > 0 && letterIdx < rootLetterIdx) oct++;
    if (i === names.length) oct = rootOct + 1;
    const h = BASE_H[letter] + (oct - 4) * 3.5;
    result.push({ h, acc, name, noteNum: root.n + intervals[Math.min(i, intervals.length - 1)] });
  }
  return result;
}
// Full ascending + descending scale sequence
function getFullScaleNotes(rootIdx, type) {
  var asc = getScaleStaffHeights(rootIdx, type);
  return asc.concat(asc.slice().reverse().slice(1));
}

//  HANON HELPERS

function diatonicToSemi(d) {
  var oct = Math.floor(d / 7);
  var deg = ((d % 7) + 7) % 7;
  return -9 + C_MAJ_SEMI[deg] + oct * 12;
}
function diatonicToHeight(d) { return -1 + d * 0.5; }
function diatonicToName(d) {
  var deg = ((d % 7) + 7) % 7;
  return C_MAJ_NAME[deg];
}
function getHanonBarNotes(exIdx, barNum) {
  var ex = HANON_EXERCISES[exIdx];
  var ascending = barNum < HANON_BARS;
  var startD;
  if (ascending) { startD = barNum; }
  else { startD = (HANON_BARS - 1) - (barNum - HANON_BARS); }
  var pattern = ascending ? ex.up : ex.up.map(function(o) { return -o; });
  var fingers = ascending ? ex.rh : ex.lh;
  return pattern.map(function(offset, i) {
    var d = startD + offset;
    return { h: diatonicToHeight(d), noteNum: diatonicToSemi(d), name: diatonicToName(d), acc: 'natural', finger: fingers[i] };
  });
}

// Progress tracking
function saveScore(game, level, score, total) {
  try {
    const data = JSON.parse(localStorage.getItem('pms_scores') || '{}');
    const key = game + '_' + level;
    if (!data[key] || score > data[key].best) {
      data[key] = { best: score, total: total, date: new Date().toISOString().slice(0,10) };
    }
    data._played = (data._played || 0) + 1;
    data._lastGame = game;
    const today = new Date().toISOString().slice(0,10);
    if (data._lastDay !== today) {
      const y = new Date(Date.now() - 86400000).toISOString().slice(0,10);
      data._streak = (data._lastDay === y) ? (data._streak || 0) + 1 : 1;
      data._lastDay = today;
    }
    localStorage.setItem('pms_scores', JSON.stringify(data));
  } catch(e) {}
}
function loadScores() {
  try { return JSON.parse(localStorage.getItem('pms_scores') || '{}'); } catch(e) { return {}; }
}
function saveDailyScore(score, total) {
  try {
    const data = JSON.parse(localStorage.getItem('pms_scores') || '{}');
    const today = new Date().toISOString().slice(0,10);
    data._dailyScore = score; data._dailyTotal = total; data._dailyDate = today;
    const y = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    if (data._dailyPrevDay === y) data._dailyStreak = (data._dailyStreak || 0) + 1;
    else if (data._dailyPrevDay !== today) data._dailyStreak = 1;
    data._dailyPrevDay = today;
    localStorage.setItem('pms_scores', JSON.stringify(data));
  } catch(e) {}
}
function getDailyGame() {
  const games = ['ear','note','interval','chord'];
  return games[new Date().getDay() % 4];
}
function dailyPlayed() {
  const d = loadScores();
  return d._dailyDate === new Date().toISOString().slice(0,10);
}

function addXP(amount) {
  const data = JSON.parse(localStorage.getItem('pms_scores') || '{}');
  data._xp = (data._xp || 0) + amount;
  const oldLvl = data._level || 1;
  data._level = Math.floor(Math.sqrt((data._xp || 0) / 50)) + 1;
  localStorage.setItem('pms_scores', JSON.stringify(data));
  if (data._level > oldLvl) showLevelUp(data._level);
  return data._xp;
}
function getXP() { const d = loadScores(); return { xp: d._xp || 0, level: d._level || 1 }; }
function xpForLevel(lvl) { return (lvl - 1) * (lvl - 1) * 50; }
function showLevelUp(lvl) {
  sfxLevelUp();
  confetti();
  const el = document.createElement('div');
  el.className = 'achievement-toast levelup-toast';
  el.innerHTML = `🎉 <strong>LEVEL UP!</strong> You reached Level ${lvl}!`;
  document.body.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity 0.4s';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 450);
  }, 3200);
}

function xpBarHtml() {
  const { xp, level } = getXP();
  const curFloor = xpForLevel(level);
  const nextFloor = xpForLevel(level + 1);
  const span = Math.max(1, nextFloor - curFloor);
  const pct = Math.max(0, Math.min(100, ((xp - curFloor) / span * 100))).toFixed(0);
  return `<div class="xp-card">
      <div class="xp-row">
        <span class="xp-level">⭐ Level ${level}</span>
        <span class="xp-amount">${Math.max(0, xp - curFloor)} / ${span} XP</span>
      </div>
      <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="xp-total">Total XP: ${xp}</div>
    </div>`;
}

function pulseClass(gameKey, data) {
  return ((data._streak || 0) >= 1 && data._lastGame === gameKey) ? ' pulse-btn' : '';
}

}
function showAchievementToast(a) {
  sfxAchievement();

  el.className = 'achievement-toast';

  const data = loadScores();

  const newly = [];
  ACHIEVEMENTS.forEach(a => {
    if (!unlocked.includes(a.id) && typeof a.check === 'function' && a.check(data)) {
      unlocked.push(a.id);
      newly.push(a);
    }
  });
  if (newly.length) {

  }
  return unlocked;
}

// Records a correct answer: awards XP, bumps an optional counter, checks achievements
function recordCorrectAnswer(counterKey) {
  addXP(10);
  if (counterKey) {
    const data = loadScores();
    data[counterKey] = (data[counterKey] || 0) + 1;
    try { localStorage.setItem('pms_scores', JSON.stringify(data)); } catch(e) {}
  }
  checkAchievements();
}

// Marks a game mode as played (for the Explorer achievement)
function markGamePlayed(key) {
  const data = loadScores();
  data._gamesPlayed = data._gamesPlayed || {};
  if (!data._gamesPlayed[key]) {
    data._gamesPlayed[key] = true;
    try { localStorage.setItem('pms_scores', JSON.stringify(data)); } catch(e) {}
    checkAchievements();
  }
}

// Called when a round of questions finishes — round + perfect + daily XP bonuses
function finishRound(game) {
  addXP(25);
  if (S.score === S.total) addXP(50);
  if (S.isDaily) addXP(40);
  const data = loadScores();
  if (S.score === S.total && S.total === 10) data._perfectCount = (data._perfectCount || 0) + 1;
  data._gamesPlayed = data._gamesPlayed || {};
  data._gamesPlayed[game] = true;
  try { localStorage.setItem('pms_scores', JSON.stringify(data)); } catch(e) {}
  checkAchievements();
}

  const data = loadTheoryProgress();
  const wasPassed = !!(data[lessonId] && data[lessonId].passed);
  const nowPassed = score >= 2;
  const prevBest = (data[lessonId] && data[lessonId].best) || 0;
  data[lessonId] = { passed: wasPassed || nowPassed, best: Math.max(prevBest, score), total: total };
  try { localStorage.setItem('pms_theory', JSON.stringify(data)); } catch(e) {}
  return { passed: nowPassed, isNewPass: nowPassed && !wasPassed };
}

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const $ = id => document.getElementById(id);

function noteToFreq(n) { return 440 * Math.pow(2, n / 12); }

// Weighted random choice
function weightedChoice(items, weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) {
    r -= weights[i];
    if (r <= 0) return items[i];
  }
  return items[items.length - 1];
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function makeNote(ctx, freq, startTime, duration, vol) {
  const master = ctx.createGain();
  master.gain.setValueAtTime(vol, startTime);
  master.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  master.connect(ctx.destination);
  [1, 2, 3, 4].forEach((ratio, i) => {
    const amp = [1, 0.35, 0.12, 0.04][i];
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * ratio;
    g.gain.setValueAtTime(amp, startTime);
    g.gain.exponentialRampToValueAtTime(amp * 0.15, startTime + duration * 0.4);
    osc.connect(g); g.connect(master);
    osc.start(startTime); osc.stop(startTime + duration);
  });
}

function playTones(n1, n2, speed) {
  const ctx = getAudioCtx(), now = ctx.currentTime;
  makeNote(ctx, noteToFreq(n1), now, speed, 0.35);
  makeNote(ctx, noteToFreq(n2), now + speed, speed, 0.35);
}

function playNote(n) {
  makeNote(getAudioCtx(), noteToFreq(n), getAudioCtx().currentTime, 1.0, 0.4);
}

function playChord(notes) {
  const ctx = getAudioCtx(), now = ctx.currentTime;
  notes.forEach(n => makeNote(ctx, noteToFreq(n), now, 1.5, 0.22));
}

function sfxEnabled() { return localStorage.getItem('pms_sfx') !== 'off'; }

function sfxCorrect() {
  if (!sfxEnabled()) return;
  // Quick bright two-note chime (C5 → E5)
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  [523, 659].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.2, now + i * 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.2);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.25);
  });
}

function sfxWrong() {
  if (!sfxEnabled()) return;
  // Gentle low buzz
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = 220;
  g.gain.setValueAtTime(0.15, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.3);
}

function sfxLevelUp() {
  if (!sfxEnabled()) return;
  // Ascending arpeggio: C5-E5-G5-C6
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  [523, 659, 784, 1047].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.25, now + i * 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now + i * 0.12); osc.stop(now + i * 0.12 + 0.35);
  });
}

function sfxAchievement() {
  if (!sfxEnabled()) return;
  // Bright sparkle: quick ascending then a held high note
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  [880, 1109, 1319, 1760].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const vol = i === 3 ? 0.3 : 0.15;
    const dur = i === 3 ? 0.5 : 0.1;
    g.gain.setValueAtTime(vol, now + i * 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + dur + 0.05);
  });
}

function drawStaff(canvasId, noteHeight, accidental, clef) {
  const c = $(canvasId);
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#a2cafb';
  ctx.fillRect(0, 0, W, H);

  // Staff geometry
  const staffLeft = 40, staffRight = W - 40;
  const lineSpacing = 28;
  const bottomLine = H / 2 + lineSpacing * 2; // y of line 0

  function yOf(h) { return bottomLine - h * lineSpacing; }

  // Draw 5 staff lines
  ctx.strokeStyle = '#1a2a3a';
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const y = yOf(i);
    ctx.beginPath();
    ctx.moveTo(staffLeft, y);
    ctx.lineTo(staffRight, y);
    ctx.stroke();
  }

  // Ledger lines
  const noteX = W / 2;
  const ledgerHalf = 22;
  ctx.lineWidth = 2;
  if (noteHeight <= -1) { const y = yOf(-1); ctx.beginPath(); ctx.moveTo(noteX-ledgerHalf, y); ctx.lineTo(noteX+ledgerHalf, y); ctx.stroke(); }
  if (noteHeight <= -2) { const y = yOf(-2); ctx.beginPath(); ctx.moveTo(noteX-ledgerHalf, y); ctx.lineTo(noteX+ledgerHalf, y); ctx.stroke(); }
  if (noteHeight >= 5)  { const y = yOf(5);  ctx.beginPath(); ctx.moveTo(noteX-ledgerHalf, y); ctx.lineTo(noteX+ledgerHalf, y); ctx.stroke(); }
  if (noteHeight >= 6)  { const y = yOf(6);  ctx.beginPath(); ctx.moveTo(noteX-ledgerHalf, y); ctx.lineTo(noteX+ledgerHalf, y); ctx.stroke(); }

  // Note head (filled ellipse)
  const ny = yOf(noteHeight);
  ctx.fillStyle = '#1a2a3a';
  ctx.beginPath();
  ctx.ellipse(noteX, ny, 12, 9, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Accidental
  ctx.fillStyle = '#1a2a3a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const accX = noteX - 28;
  if (accidental === 'sharp') {
    ctx.font = '700 28px Quicksand'; ctx.fillText('#', accX, ny - 2);
  } else if (accidental === 'flat') {
    ctx.font = '28px serif'; ctx.fillText('♭', accX, ny - 2);
  } else if (accidental === 'double_sharp') {
    ctx.font = '24px serif'; ctx.fillText('𝄪', accX, ny);
  } else if (accidental === 'double_flat') {
    ctx.font = '24px serif'; ctx.fillText('𝄫', accX, ny);
  }

  // Clef title
  ctx.fillStyle = '#2c5f8a';
  ctx.font = '700 22px Quicksand';
  ctx.textAlign = 'center';
  ctx.fillText(clef.charAt(0).toUpperCase() + clef.slice(1) + ' Clef', W / 2, 28);
}

function drawIntervalStaff(canvasId, h1, h2) {
  const c = $(canvasId);
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#a2cafb';
  ctx.fillRect(0, 0, W, H);

  const staffLeft = 40, staffRight = W - 40;
  const lineSpacing = 28;
  const bottomLine = H / 2 + lineSpacing * 2;
  function yOf(h) { return bottomLine - h * lineSpacing; }

  ctx.strokeStyle = '#1a2a3a';
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const y = yOf(i);
    ctx.beginPath(); ctx.moveTo(staffLeft, y); ctx.lineTo(staffRight, y); ctx.stroke();
  }

  const noteX1 = W / 2 - 45, noteX2 = W / 2 + 45;
  [{ x: noteX1, h: h1 }, { x: noteX2, h: h2 }].forEach(({ x, h }) => {
    const lh = 22;
    if (h <= -1) { const y=yOf(-1); ctx.beginPath(); ctx.moveTo(x-lh,y); ctx.lineTo(x+lh,y); ctx.stroke(); }
    if (h <= -2) { const y=yOf(-2); ctx.beginPath(); ctx.moveTo(x-lh,y); ctx.lineTo(x+lh,y); ctx.stroke(); }
    if (h >= 5)  { const y=yOf(5);  ctx.beginPath(); ctx.moveTo(x-lh,y); ctx.lineTo(x+lh,y); ctx.stroke(); }
    if (h >= 6)  { const y=yOf(6);  ctx.beginPath(); ctx.moveTo(x-lh,y); ctx.lineTo(x+lh,y); ctx.stroke(); }
    ctx.fillStyle = '#1a2a3a';
    ctx.beginPath(); ctx.ellipse(x, yOf(h), 12, 9, -0.2, 0, Math.PI * 2); ctx.fill();
  });

  ctx.fillStyle = '#2c5f8a';
  ctx.font = '700 22px Quicksand';
  ctx.textAlign = 'center';
  ctx.fillText('What interval?', W / 2, 28);
}

function drawChordStaff(canvasId, heights, accidentals, clef) {
  const c = $(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#a2cafb';
  ctx.fillRect(0, 0, W, H);

  const staffLeft = 40, staffRight = W - 40;
  const lineSpacing = 28;
  const bottomLine = H / 2 + lineSpacing * 2;
  function yOf(h) { return bottomLine - h * lineSpacing; }

  ctx.strokeStyle = '#1a2a3a';
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const y = yOf(i);
    ctx.beginPath(); ctx.moveTo(staffLeft, y); ctx.lineTo(staffRight, y); ctx.stroke();
  }

  const noteX = W / 2 + 10;
  const lh = 26;
  const minH = Math.min(...heights), maxH = Math.max(...heights);
  for (let ledger = -1; ledger >= Math.floor(minH); ledger--) {
    if (ledger < 0) { const y=yOf(ledger); ctx.beginPath(); ctx.moveTo(noteX-lh,y); ctx.lineTo(noteX+lh,y); ctx.stroke(); }
  }
  for (let ledger = 5; ledger <= Math.ceil(maxH); ledger++) {
    const y=yOf(ledger); ctx.beginPath(); ctx.moveTo(noteX-lh,y); ctx.lineTo(noteX+lh,y); ctx.stroke();
  }

  // Draw note heads and accidentals
  let prevAccX = -999;
  heights.forEach((h, i) => {
    const ny = yOf(h);
    ctx.fillStyle = '#1a2a3a';
    ctx.beginPath(); ctx.ellipse(noteX, ny, 12, 9, -0.2, 0, Math.PI * 2); ctx.fill();

    const acc = accidentals[i];
    if (acc !== 'natural') {
      let accX = noteX - 30;
      if (Math.abs(ny - prevAccX) < 24) accX -= 18;
      ctx.fillStyle = '#1a2a3a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (acc === 'sharp') { ctx.font = '700 28px Quicksand'; ctx.fillText('#', accX, ny - 2); }
      else if (acc === 'flat') { ctx.font = '28px serif'; ctx.fillText('♭', accX, ny - 2); }
      prevAccX = ny;
    }
  });

  ctx.fillStyle = '#2c5f8a';
  ctx.font = '700 22px Quicksand';
  ctx.textAlign = 'center';
  ctx.fillText(clef.charAt(0).toUpperCase() + clef.slice(1) + ' Clef', W / 2, 28);
}

// Draw scale notes on a staff (for Scale Explorer)
function drawScaleStaff(canvasId, staffNotes, currentIdx) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#d4e8fc';
  ctx.fillRect(0, 0, W, H);

  const staffLeft = 20, staffRight = W - 20;
  const LS = 20;
  const bottomLine = H * 0.65;
  function yOf(h) { return bottomLine - h * LS; }

  // 5 staff lines
  ctx.strokeStyle = '#3a5a7a';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const y = yOf(i);
    ctx.beginPath(); ctx.moveTo(staffLeft, y); ctx.lineTo(staffRight, y); ctx.stroke();
  }

  // Scale label
  const root = SCALE_ROOTS[S.scaleRoot];
  ctx.fillStyle = '#2c5f8a';
  ctx.font = '700 15px Quicksand';
  ctx.textAlign = 'center';
  ctx.fillText(root.name + ' ' + S.scaleType, W / 2, 16);

  // Notes — scale sizes for many notes
  const totalNotes = staffNotes.length;
  const noteStart = staffLeft + 25;
  const noteEnd = staffRight - 10;
  const gap = totalNotes > 1 ? (noteEnd - noteStart) / (totalNotes - 1) : 0;
  const NR = totalNotes > 10 ? 7 : 9;   // note head x-radius
  const NRY = totalNotes > 10 ? 5.5 : 7; // note head y-radius
  const accOff = totalNotes > 10 ? 13 : 16;
  const ledgerW = totalNotes > 10 ? 11 : 14;

  staffNotes.forEach((note, i) => {
    const x = noteStart + i * gap;
    const y = yOf(note.h);

    // Ledger lines
    ctx.strokeStyle = '#3a5a7a'; ctx.lineWidth = 1.5;
    for (let l = -1; note.h <= l; l--) {
      const ly = yOf(l);
      ctx.beginPath(); ctx.moveTo(x - ledgerW, ly); ctx.lineTo(x + ledgerW, ly); ctx.stroke();
    }
    for (let l = 5; note.h >= l; l++) {
      const ly = yOf(l);
      ctx.beginPath(); ctx.moveTo(x - ledgerW, ly); ctx.lineTo(x + ledgerW, ly); ctx.stroke();
    }

    // Color: completed=green, current=purple/red, upcoming=dark
    let color = '#1a2a3a';
    if (i < currentIdx) color = '#4CAF50';
    else if (i === currentIdx && S.scalePracticing) {
      color = S.scaleErrorFlash ? '#e53935' : '#7c6fef';
    }

    // Note head
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, NR, NRY, -0.15, 0, Math.PI * 2);
    ctx.fill();

    // Accidental (only show once per unique note in sequence)
    if (note.acc !== 'natural') {
      ctx.fillStyle = color;
      ctx.font = totalNotes > 10 ? '700 12px Quicksand' : '700 15px Quicksand';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(note.acc === 'sharp' ? '#' : '♭', x - accOff, y);
    }

    // Note name below staff
    ctx.fillStyle = color;
    ctx.font = totalNotes > 10 ? '600 9px Quicksand' : '600 11px Quicksand';
    ctx.textAlign = 'center';
    ctx.fillText(note.name, x, H - 5);
  });

  // Ring around current target
  if (S.scalePracticing && currentIdx < totalNotes) {
    const x = noteStart + currentIdx * gap;
    const y = yOf(staffNotes[currentIdx].h);
    ctx.strokeStyle = S.scaleErrorFlash ? '#e53935' : '#7c6fef';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(x, y, NR + 5, NRY + 5, -0.15, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function newEarRound() {
  let pool;
  if (S.level === '1') pool = PIANO_WHITE.slice(0, 7);
  else if (S.level === '2') pool = PIANO_WHITE;
  else pool = [...PIANO_WHITE, ...PIANO_BLACK];

  // Level 4 & 5: use full pool
  if (S.level === '4' || S.level === '5') pool = [...PIANO_WHITE, ...PIANO_BLACK];

  const note = pick(pool);
  S.earTargetN = note.n;
  S.earTargetName = note.name;
  S.earTargetFlat = note.flat || '';
  S.earFeedback = null;

  // Level 5: two-note sequence — pick a second note
  if (S.level === '5') {
    let note2 = pick(pool);
    while (note2.n === note.n) note2 = pick(pool);
    S.earTarget2N = note2.n;
    S.earTarget2Name = note2.name;
    S.earTarget2Flat = note2.flat || '';
    S.earStep = 1; // which note we're answering (1 or 2)
  } else {
    S.earTarget2N = null;
    S.earStep = 0;
  }

  // Build multiple-choice buttons
  const allNames = pool.map(n => n.flat ? n.name+'/'+n.flat : n.name);
  const unique = [...new Set(allNames)];
  const correct = note.flat ? note.name+'/'+note.flat : note.name;
  const numChoices = (S.level === '4' || S.level === '5') ? 6 : 4;
  const choices = new Set([correct]);
  while (choices.size < Math.min(numChoices, unique.length)) choices.add(pick(unique));
  S.earChoices = [...choices].sort(() => Math.random() - 0.5);
}

function newNoteRound() {
  let spot, clef, names, heights, acc;
  if (S.level === '1') {
    spot = randInt(0, 12);
    clef = S.chosenClef;
    names = clef === 'treble' ? TREBLE_NAMES : BASS_NAMES;
    heights = HEIGHTS;
    acc = 'natural';
  } else if (S.level === '2') {
    spot = randInt(0, 12);
    clef = pick(['treble', 'bass']);
    names = clef === 'treble' ? TREBLE_NAMES : BASS_NAMES;
    heights = HEIGHTS;
    acc = weightedChoice(['flat','sharp','natural'], [3,3,4]);
  } else if (S.level === '3') {
    spot = randInt(0, 16);
    clef = pick(['treble', 'bass']);
    names = clef === 'treble' ? TREBLE_HARD : BASS_HARD;
    heights = HEIGHTS_HARD;
    acc = weightedChoice(['natural','sharp','flat','double_sharp','double_flat'], [3,3,3,1,1]);
  } else if (S.level === '4') {
    // Bass clef only, sharps and flats
    spot = randInt(0, 12);
    clef = 'bass';
    names = BASS_NAMES;
    heights = HEIGHTS;
    acc = weightedChoice(['natural','sharp','flat'], [4,3,3]);
  } else {
    // Level 5: both clefs, extended range, timed pressure (just harder content)
    spot = randInt(0, 16);
    clef = pick(['treble', 'bass']);
    names = clef === 'treble' ? TREBLE_HARD : BASS_HARD;
    heights = HEIGHTS_HARD;
    acc = weightedChoice(['natural','sharp','flat','double_sharp','double_flat'], [2,3,3,1,1]);
  }
  let fullName = names[spot];
  if (acc === 'sharp') fullName += '#';
  else if (acc === 'flat') fullName += 'b';
  else if (acc === 'double_sharp') fullName += '##';
  else if (acc === 'double_flat') fullName += 'bb';

  S.noteClef = clef;
  S.noteHeight = heights[spot];
  S.noteAccidental = acc;
  S.noteFullName = fullName;
  S.noteFeedback = null;
}

function newIntervalRound() {
  const pool = S.level==='1' ? EASY_INT : S.level==='2' ? MEDIUM_INT : HARD_INT;
  const avail = pool.filter(n => INTERVAL_PAIRS[n]?.length);
  const intName = pick(avail);
  const pair = pick(INTERVAL_PAIRS[intName]);
  if (Math.random() < 0.5) { S.intH1 = pair[0]; S.intH2 = pair[1]; }
  else { S.intH1 = pair[1]; S.intH2 = pair[0]; }
  S.intCorrect = intName;
  S.intFeedback = null;
  // Levels 4-5: ear-based (play audio, more choices)
  S.intEarMode = (S.level === '4' || S.level === '5');
  const numChoices = S.intEarMode ? 6 : 4;
  const choices = new Set([intName]);
  while (choices.size < Math.min(numChoices, avail.length)) choices.add(pick(avail));
  S.intChoices = [...choices].sort(() => Math.random() - 0.5);
  S.intKeys = [S.intH1, S.intH2].map(h => {
    const idx = (h + 1) * 2;
    return PIANO_WHITE[idx] ? PIANO_WHITE[idx].n : null;
  }).filter(n => n !== null);
}

function newChordRound() {
  const types = S.level==='1' ? EASY_CHORDS : S.level==='2' ? MED_CHORDS :
    (S.level==='4' || S.level==='5') ? HARD_CHORDS : HARD_CHORDS;
  // Levels 4-5: ear only (no staff shown)
  S.chordEarOnly = (S.level === '4' || S.level === '5');
  S.chordType = pick(types);
  // Pick clef
  S.chordClef = S.level === '1' ? 'treble' : pick(['treble', 'bass']);
  // Pick root from available roots for the clef
  const rootMap = S.chordClef === 'treble' ? TREBLE_CHORD_H : BASS_CHORD_H;
  const rootNames = Object.keys(rootMap);
  S.chordRootName = pick(rootNames);
  // Get note numbers for audio
  const rootNMap = S.chordClef === 'treble' ? TREBLE_ROOT_N : BASS_ROOT_N;
  S.chordRoot = rootNMap[S.chordRootName];
  S.chordNotes = CHORD_INTERVALS[S.chordType].map(i => S.chordRoot + i);
  // Get staff positions
  const info = getChordStaffInfo(S.chordRootName, S.chordType, S.chordClef);
  S.chordHeights = info.heights;
  S.chordAccidentals = info.accidentals;
  S.chordAnswer = S.chordRootName + ' ' + S.chordType;
  S.chordFeedback = null;
  // Build choices — mix of roots and types
  const numChordChoices = (S.level === '4' || S.level === '5') ? 6 : 4;
  const choices = new Set([S.chordAnswer]);
  while (choices.size < numChordChoices) {
    const r = pick(rootNames);
    const t = pick(types);
    choices.add(r + ' ' + t);
  }
  S.chordChoices = [...choices].sort(() => Math.random() - 0.5);
}

function buildPiano(hlNs) {
  hlNs = hlNs || [];
  const W = 30, BW = 20;
  let h = '<div class="piano-wrap" style="height:120px">';
  PIANO_WHITE.forEach(k => {
    const cls = hlNs.includes(k.n) ? ' p-hl' : '';
    h += `<div class="p-white${cls}" onmousedown="pianoDown(${k.n},'${k.name}')" onmouseup="pianoUp(${k.n})" onmouseleave="pianoUp(${k.n})" ontouchstart="event.preventDefault();pianoDown(${k.n},'${k.name}')" ontouchend="pianoUp(${k.n})"></div>`;
  });
  PIANO_BLACK.forEach(k => {
    const left = (k.after + 1) * W - BW / 2;
    const cls = hlNs.includes(k.n) ? ' p-bk-hl' : '';
    h += `<div class="p-black${cls}" onmousedown="pianoDown(${k.n},'${k.name}')" onmouseup="pianoUp(${k.n})" onmouseleave="pianoUp(${k.n})" ontouchstart="event.preventDefault();pianoDown(${k.n},'${k.name}')" ontouchend="pianoUp(${k.n})" style="left:${left}px"></div>`;
  });
  h += '</div>';
  return h;
}

const pianoOscs = {};
function pianoDown(n, name) {
  if (pianoOscs[n]) return;
  markGamePlayed('piano');
  const ctx = getAudioCtx();
  const freq = noteToFreq(n);
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.4, ctx.currentTime);
  master.connect(ctx.destination);
  const oscs = [1, 2, 3, 4].map((ratio, i) => {
    const amp = [1, 0.35, 0.12, 0.04][i];
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * ratio;
    g.gain.setValueAtTime(amp, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(amp * 0.25, ctx.currentTime + 0.4);
    osc.connect(g); g.connect(master);
    osc.start();
    return osc;
  });
  pianoOscs[n] = { oscs, master };
  S.pianoLastNote = name;
  const disp = $('pianoDisplay');
  const bk = PIANO_BLACK.find(k => k.n === n);
  if (disp) disp.textContent = bk ? name + '/' + bk.flat : name;
  // Piano is for free play only now — ear trainer uses buttons
}
function pianoUp(n) {
  if (!pianoOscs[n]) return;
  const e = pianoOscs[n], ctx = getAudioCtx();
  e.master.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
  e.oscs.forEach(o => o.stop(ctx.currentTime + 0.12));
  delete pianoOscs[n];
}

function startGame(game, level, rounds, clef) {
  S.score = 0; S.roundNum = 0;
  S.total = rounds || 10;
  S.level = level;
  if (clef) S.chosenClef = clef;
  markGamePlayed(game);
  if (game === 'ear') { newEarRound(); render('ear_play'); }
  else if (game === 'interval') { newIntervalRound(); render('interval_play'); }
  else if (game === 'chord') { newChordRound(); render('chord_play'); }
  else { newNoteRound(); render('note_play'); }
}

function nextRound(game) {
  S.roundNum++;
  if (S.roundNum >= S.total) { render(game + '_result'); }
  else {
    if (game === 'ear') newEarRound();
    else if (game === 'interval') newIntervalRound();
    else if (game === 'chord') newChordRound();
    else newNoteRound();
    render(game + '_play');
  }
}

        h += `<div class="alert alert-warning"><strong>Pebbles says:</strong> '${pick(P.MEH)}'</div>`;
      }
      h += `<div class="btn-row">
              <button class="btn btn-mint" onclick="startRhythmLevel('${S.rhythmLevel}')">🔄 Try Again</button>
              <button class="btn btn-lilac" onclick="render('rhythm_level')">🥁 Levels</button>
            </div>`;
    }
    h += `</div>`;
    h += `<button class="btn btn-lilac btn-wide" onclick="clearRhythmTimers();render('home')">🏠 Home</button>`;
  }

  // ── MUSIC THEORY HOME ──
  else if (page === 'theory_home') {
    const theoryProgress = loadTheoryProgress();
    h += `<h1>📖 Music Theory</h1>`;
    h += `<div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.4rem">${pebbles('happy',90)}
      <p class="speech"><strong>Pebbles says:</strong> 'Pick a lesson to learn, ${S.name}!'</p></div>`;
    THEORY_LESSONS.forEach(l => {
      const prog = theoryProgress[l.id];
      const passed = prog && prog.passed;
      h += `<div class="card theory-card" onclick="openTheoryLesson('${l.id}')">`;
      h += `<div style="display:flex;align-items:center;gap:0.7rem">
              <span style="font-size:1.6rem">${l.icon}</span>
              <span style="font-weight:700;color:#0f2744">${l.title}</span>
            </div>`;
      h += passed ? `<span style="font-size:1.3rem">✅</span>` : `<span style="font-size:0.8rem;color:#6b7fa3;font-weight:700">Start ➡️</span>`;
      h += `</div>`;
    });
    h += `<button class="btn btn-lilac btn-wide" style="margin-top:0.4rem" onclick="render('home')">🏠 Home</button>`;
  }

  // ── MUSIC THEORY LESSON ──
  else if (page === 'theory_lesson') {
    const lesson = THEORY_LESSONS.find(l => l.id === S.theoryLesson);
    h += `<h1>${lesson.icon} ${lesson.title}</h1>`;
    if (S.theoryPhase === 'explain') {
      const step = lesson.steps[S.theoryStep];
      const total = lesson.steps.length;
      h += `<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem">`;
      h += `<div style="font-size:0.75rem;font-weight:700;color:#6b7fa3">Step ${S.theoryStep + 1} of ${total}</div>`;
      h += `<div style="flex:1;height:6px;background:rgba(255,255,255,0.3);border-radius:6px;overflow:hidden">`;
      h += `<div style="height:100%;width:${((S.theoryStep + 1) / total) * 100}%;background:var(--accent, #7c6fef);border-radius:6px;transition:width 0.3s"></div>`;
      h += `</div></div>`;
      h += pebbles(S.theoryStep === 0 ? 'asking' : 'happy', 90);
      h += `<div class="card">`;
      h += `<p style="font-weight:700;font-size:1.05rem;color:#0f2744;margin-bottom:0.4rem">${step.title}</p>`;
      h += `<p class="speech">${step.text}</p>`;
      h += `</div>`;
      if (S.theoryStep < total - 1) {
        h += `<div class="btn-row">`;
        if (S.theoryStep > 0) h += `<button class="btn btn-blue" onclick="S.theoryStep--;render('theory_lesson')">⬅ Back</button>`;
        h += `<button class="btn btn-mint" style="flex:2" onclick="S.theoryStep++;render('theory_lesson')">Next ➡️</button>`;
        h += `</div>`;
      } else {
        h += `<div class="btn-row">`;
        if (S.theoryStep > 0) h += `<button class="btn btn-blue" onclick="S.theoryStep--;render('theory_lesson')">⬅ Back</button>`;
        h += `<button class="btn btn-coral" style="flex:2" onclick="startTheoryQuiz()">📝 Take the Quiz!</button>`;
        h += `</div>`;
      }
    } else if (S.theoryPhase === 'quiz') {
      const q = lesson.quiz[S.theoryQIdx];
      h += progressBar(S.theoryQIdx, lesson.quiz.length);
      if (!S.theoryFeedback) {
        h += pebbles('asking', 100);
        h += `<div class="card">`;
        h += `<p class="speech"><strong>Question ${S.theoryQIdx+1}:</strong> ${q.q}</p>`;
        h += `<div class="choice-grid">`;
        q.choices.forEach(c => {
          h += `<button class="btn btn-lilac" onclick="answerTheoryQuiz('${c.replace(/'/g,"\\'")}')">${c}</button>`;
        });
        h += `</div></div>`;
      } else if (S.theoryFeedback === 'correct') {
        h += pebbles('happy');
        h += `<div class="alert alert-success">🌸 <strong>Pebbles says:</strong> '${pick(P.YAY_NOTE)}'</div>`;
        h += `<button class="btn btn-lilac btn-wide" onclick="nextTheoryQuestion()">Next ➡️</button>`;
      } else {
        h += pebbles('thinking');
        h += `<div class="alert alert-error"><strong>Pebbles says:</strong> 'The answer was <strong>${q.answer}</strong>!'</div>`;
        h += `<button class="btn btn-lilac btn-wide" onclick="nextTheoryQuestion()">Next ➡️</button>`;
      }
    } else if (S.theoryPhase === 'result') {
      h += `<div class="score-big">${S.theoryScore} / ${lesson.quiz.length}</div>`;
      const passed = S.theoryScore >= 2;
      if (passed) {
        h += pebbles('happy');
        h += `<div class="alert alert-success">🌸 <strong>Pebbles says:</strong> 'You passed! ${pick(P.GOOD)}'</div>`;
        if (S.theoryScore === lesson.quiz.length) setTimeout(confetti, 300);
      } else {
        h += pebbles('thinking');
        h += `<div class="alert alert-warning"><strong>Pebbles says:</strong> 'Almost! ${pick(P.MEH)}'</div>`;
      }
      h += `<div class="btn-row">
              <button class="btn btn-mint" onclick="openTheoryLesson('${lesson.id}')">🔄 Review</button>
              <button class="btn btn-lilac" onclick="render('theory_home')">📖 Lessons</button>
            </div>`;
    }
    h += `<button class="btn btn-lilac btn-wide" style="margin-top:0.6rem" onclick="render('theory_home')">⬅ Back</button>`;
  }

  // ── SONG LIBRARY ──
  else if (page === 'song_library') {
    h += `<h1>🎵 Song Library</h1>`;
    h += `<div class="card">`;
    h += `<div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.4rem">${pebbles('happy',90)}
      <p class="speech"><strong>Pebbles says:</strong> 'Pick a song and play along, ${S.name}!'</p></div>`;
    const diffs = [{d:1,label:'Easy',color:'btn-blue'},{d:2,label:'Medium',color:'btn-mint'},{d:3,label:'Hard',color:'btn-coral'},{d:4,label:'Expert',color:'btn-pink'}];
    diffs.forEach(df => {
      const songs = SONG_LIBRARY.filter(s => s.d === df.d);
      if (!songs.length) return;
      h += `<h3 style="margin:0.8rem 0 0.3rem;font-size:1rem">${df.label}</h3>`;
      songs.forEach(song => {
        const notes = parseSong(song.s);
        h += `<button class="btn ${df.color}" style="width:100%;margin:0.15rem 0;text-align:left;font-size:0.85rem;padding:0.5rem 0.8rem" onclick="startSongPlay('${song.id}')">
          🎵 ${song.t} <span style="opacity:0.6;font-size:0.75rem">— ${song.c} · ${notes.length} notes</span></button>`;
      });
    });
    h += `</div>`;
    h += `<button class="btn btn-lilac btn-wide" onclick="render('home')">🏠 Home</button>`;
  }

  // ── SONG PLAY (reuses sight-reading canvas) ──
  else if (page === 'song_play') {
    const song = S.currentSong;
    h += `<h1>🎵 ${song ? song.t : 'Song'}</h1>`;
    if (S.sightReadDone) {
      h += `<div class="score-big">${S.sightReadScore} / ${S.sightReadTotal}</div>`;
      if (S.sightReadScore >= S.sightReadTotal * 0.8) {
        h += pebbles('happy');
        h += `<div class="alert alert-success">🌸 <strong>Pebbles says:</strong> '${pick(P.PERFECT)}'</div>`;
      } else if (S.sightReadScore >= S.sightReadTotal * 0.5) {
        h += pebbles('happy');
        h += `<div class="alert alert-success"><strong>Pebbles says:</strong> '${pick(P.GOOD)}'</div>`;
      } else {
        h += pebbles('thinking');
        h += `<div class="alert alert-warning"><strong>Pebbles says:</strong> '${pick(P.MEH)}'</div>`;
      }
      h += `<div class="btn-row">
              <button class="btn btn-mint" onclick="startSongPlay('${song?song.id:''}')">🔄 Try Again</button>
              <button class="btn btn-lilac" onclick="render('song_library')">🎵 Songs</button>
            </div>`;
    } else {
      h += `<canvas id="sightReadCanvas" width="400" height="220" style="display:block;margin:0.5rem auto;border-radius:14px"></canvas>`;
      h += `<p class="caption" style="text-align:center">${song?song.c:''} · ${song?song.bpm:80} BPM · Play along!</p>`;
      h += `<button class="btn btn-coral btn-wide" onclick="stopSightReading();S.sightReadDone=true;S.sightReadTotal=S.sightReadNotes.length;render('song_play')">⏹ Stop</button>`;
    }
    h += `<button class="btn btn-lilac btn-wide" style="margin-top:0.5rem" onclick="stopSightReading();render('song_library')">⬅ Back to Songs</button>`;
  }

  // ── EXERCISES HOME ──
  else if (page === 'exercises_home') {
    h += `<h1>📝 Grade Exercises</h1>`;
    h += `<div class="card">`;
    h += `<div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.4rem">${pebbles('asking',90)}
      <p class="speech"><strong>Pebbles says:</strong> 'Pick a grade and test yourself, ${S.name}!'</p></div>`;
    for (let g = 1; g <= 6; g++) {
      const exs = GRADE_EXERCISES.filter(e => e.g === g);
      const doneKey = '_gradeExDone_' + g;
      const doneCount = exs.filter(e => localStorage.getItem(doneKey + '_' + e.n)).length;
      h += `<button class="btn ${g<=2?'btn-blue':g<=4?'btn-mint':'btn-coral'}" style="width:100%;margin:0.15rem 0;text-align:left;padding:0.5rem 0.8rem" onclick="S.exGrade=${g};render('exercise_grade')">
        📝 Grade ${g} <span style="opacity:0.6;font-size:0.8rem">(${doneCount}/${exs.length} done)</span></button>`;
    }
    h += `</div>`;
    h += `<button class="btn btn-lilac btn-wide" onclick="render('home')">🏠 Home</button>`;
  }

  // ── EXERCISE GRADE (list exercises for a grade) ──
  else if (page === 'exercise_grade') {
    const g = S.exGrade || 1;
    const exs = GRADE_EXERCISES.filter(e => e.g === g);
    h += `<h1>📝 Grade ${g} Exercises</h1>`;
    h += `<div class="card">`;
    exs.forEach(ex => {
      const doneKey = '_gradeExDone_' + g + '_' + ex.n;
      const done = localStorage.getItem(doneKey);
      h += `<button class="btn btn-blue" style="width:100%;margin:0.15rem 0;text-align:left;padding:0.5rem 0.8rem" onclick="startExercise(${g},${ex.n})">
        ${ex.icon} Ex ${ex.n}: ${ex.t} ${done ? '✅' : ''}</button>`;
    });
    h += `</div>`;
    h += `<button class="btn btn-lilac btn-wide" onclick="render('exercises_home')">⬅ Back to Grades</button>`;
  }

  // ── EXERCISE PLAY ──
  else if (page === 'exercise_play') {
    const ex = S.currentExercise;
    const qi = S.exQuestionIdx || 0;
    const total = ex ? ex.qs.length : 0;
    h += `<h1>${ex?ex.icon:''} Grade ${ex?ex.g:''}: ${ex?ex.t:''}</h1>`;
    if (S.exDone) {
      const score = S.exScore || 0;
      h += `<div class="score-big">${score} / ${total}</div>`;
      if (score === total) {
        h += pebbles('happy');
        h += `<div class="alert alert-success">🌸 <strong>Pebbles says:</strong> '${pick(P.PERFECT)}'</div>`;
      } else if (score >= total * 0.5) {
        h += pebbles('happy');
        h += `<div class="alert alert-success"><strong>Pebbles says:</strong> '${pick(P.GOOD)}'</div>`;
      } else {
        h += pebbles('thinking');
        h += `<div class="alert alert-warning"><strong>Pebbles says:</strong> '${pick(P.MEH)}'</div>`;
      }
      if (score === total) {
        localStorage.setItem('_gradeExDone_' + ex.g + '_' + ex.n, '1');
      }
      h += `<div class="btn-row">
              <button class="btn btn-mint" onclick="startExercise(${ex.g},${ex.n})">🔄 Retry</button>
              <button class="btn btn-lilac" onclick="render('exercise_grade')">📝 More Exercises</button>
            </div>`;
    } else if (ex && qi < total) {
      const q = ex.qs[qi];
      h += `<div class="card">`;
      h += `<p style="font-weight:700;margin-bottom:0.6rem">Question ${qi+1} of ${total}</p>`;
      h += `<p style="margin-bottom:0.8rem;font-size:1rem">${q.q}</p>`;
      if (S.exFeedback) {
        h += `<div class="alert ${S.exFeedback==='correct'?'alert-success':'alert-warning'}">`;
        if (S.exFeedback === 'correct') h += `✅ Correct!`;
        else h += `❌ The answer was: <strong>${q.a}</strong>`;
        h += `</div>`;
        h += `<button class="btn btn-mint btn-wide" onclick="nextExQuestion()">➡ Next</button>`;
      } else {
        q.c.forEach(c => {
          h += `<button class="btn btn-blue" style="width:100%;margin:0.15rem 0;text-align:left;padding:0.5rem 0.8rem" onclick="answerExercise('${c.replace(/'/g,"\\'")}')">${c}</button>`;
        });
      }
      h += `</div>`;
    }
    h += `<button class="btn btn-lilac btn-wide" style="margin-top:0.5rem" onclick="render('exercise_grade')">⬅ Back</button>`;
  }

  // ── SIGHT-READING LEVEL ──
  else if (page === 'sightread_level') {
    h += `<h1>📖 Sight Reading</h1>`;
    h += `<div class="card">`;
    h += `<div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.4rem">${pebbles('asking',90)}
      <p class="speech"><strong>Pebbles says:</strong> 'Notes will scroll across. Play them on your piano, ${S.name}!'</p></div>`;
    h += `<div class="btn-row">
            <button class="btn btn-blue" onclick="S.songPlayPage=false;S.sightReadLevel='easy';S.sightReadNotes=generateSightReadNotes('easy');startSightReading()">😊 Easy</button>
            <button class="btn btn-mint" onclick="S.songPlayPage=false;S.sightReadLevel='medium';S.sightReadNotes=generateSightReadNotes('medium');startSightReading()">🤔 Medium</button>
          </div>`;
    h += `<div class="btn-row">
            <button class="btn btn-coral" onclick="S.songPlayPage=false;S.sightReadLevel='hard';S.sightReadNotes=generateSightReadNotes('hard');startSightReading()">🔥 Hard</button>
            <button class="btn btn-pink" onclick="S.songPlayPage=false;S.sightReadLevel='expert';S.sightReadNotes=generateSightReadNotes('expert');startSightReading()">⚡ Expert</button>
          </div>`;
    h += `<p class="caption">Uses your microphone to hear what you play. Notes scroll left — play them in time!</p>`;
    h += `</div>`;
    h += `<button class="btn btn-lilac btn-wide" onclick="render('home')">🏠 Home</button>`;
  }

  // ── SIGHT-READING PLAY ──
  else if (page === 'sightread_play') {
    h += `<h1>📖 Sight Reading</h1>`;
    if (S.sightReadDone) {
      h += `<div class="score-big">${S.sightReadScore} / ${S.sightReadTotal}</div>`;
      if (S.sightReadScore === S.sightReadTotal) {
        h += pebbles('happy');
        h += `<div class="alert alert-success">🌸 <strong>Pebbles says:</strong> '${pick(P.PERFECT)}'</div>`;
      } else if (S.sightReadScore >= S.sightReadTotal * 0.6) {
        h += pebbles('happy');
        h += `<div class="alert alert-success"><strong>Pebbles says:</strong> '${pick(P.GOOD)}'</div>`;
      } else {
        h += pebbles('thinking');
        h += `<div class="alert alert-warning"><strong>Pebbles says:</strong> '${pick(P.MEH)}'</div>`;
      }
      h += `<div class="btn-row">
              <button class="btn btn-mint" onclick="S.sightReadNotes=generateSightReadNotes(S.sightReadLevel);startSightReading()">🔄 Try Again</button>
              <button class="btn btn-lilac" onclick="render('sightread_level')">📖 Levels</button>
            </div>`;
    } else {
      h += `<canvas id="sightReadCanvas" width="400" height="220" style="display:block;margin:0.5rem auto;border-radius:14px"></canvas>`;
      h += `<p class="caption" style="text-align:center">${SIGHTREAD_LEVELS[S.sightReadLevel].label} · ${SIGHTREAD_LEVELS[S.sightReadLevel].bpm} BPM · Play the notes!</p>`;
      h += `<button class="btn btn-coral btn-wide" onclick="stopSightReading();S.sightReadDone=true;S.sightReadTotal=S.sightReadNotes.length;render('sightread_play')">⏹ Stop</button>`;
    }
    h += `<button class="btn btn-lilac btn-wide" style="margin-top:0.5rem" onclick="stopSightReading();render('home')">🏠 Home</button>`;
  }

  h += '</div>';

  // Strip Pebbles speech when Pebbles is off or in non-cartoon modes
  if (getMode() !== 'cartoon' || localStorage.getItem('pms_pebbles') === 'off') {
    h = h.replaceAll("<strong>Pebbles says:</strong> '", '');
    h = h.replaceAll("<strong>Pebbles asks:</strong> '", '');
    h = h.replaceAll("<strong>Pebbles says:</strong>", '');
    h = h.replaceAll("<strong>Pebbles asks:</strong>", '');
    h = h.replaceAll("!'</p>", '!</p>');
    h = h.replaceAll("?'</p>", '?</p>');
    h = h.replaceAll(".'</p>", '.</p>');
    h = h.replaceAll("'</p>", '</p>');
    h = h.replaceAll("!'</span>", '!</span>');
    h = h.replaceAll("?'</span>", '?</span>');
    h = h.replaceAll("'</span>", '</span>');
  }

  app.innerHTML = h;

  // Draw staff after DOM update
  if (page === 'note_play') {
    drawStaff('staffCanvas', S.noteHeight, S.noteAccidental, S.noteClef);
    if (!S.noteFeedback) setTimeout(() => $('noteAns')?.focus(), 100);
  }
  if (page === 'interval_play' && !S.intEarMode) {
    drawIntervalStaff('intCanvas', S.intH1, S.intH2);
  }
  if (page === 'chord_play' && !S.chordEarOnly) {
    drawChordStaff('chordCanvas', S.chordHeights, S.chordAccidentals, S.chordClef);
  }
  if (page === 'scale_explorer') {
    const sn = getFullScaleNotes(S.scaleRoot, S.scaleType);
    drawScaleStaff('scaleStaffCanvas', sn, S.scaleCurrentIdx);
  }
  if (page === 'hanon') {
    var hn = getHanonBarNotes(S.hanonEx, S.hanonBar);
    drawHanonStaff('hanonStaffCanvas', hn, S.hanonCurrentIdx);
  }

  // Auto-play tones
  if (page === 'ear_play' && !S.earFeedback) {
    if (S.level === '5' && S.earTarget2N != null) {
      setTimeout(() => playTones(S.earTargetN, S.earTarget2N, 0.8), 400);
    } else {
      setTimeout(() => playNote(S.earTargetN), 400);
    }
  }
  if (page === 'interval_play' && S.intEarMode && !S.intFeedback && S.intKeys.length >= 2) {
    setTimeout(() => playTones(S.intKeys[0], S.intKeys[1], 0.6), 400);
  }
  if (page === 'chord_play' && !S.chordFeedback) {
    setTimeout(() => playChord(S.chordNotes), 400);
  }

  // Safety-net achievement check — catches any progress made during this render (e.g. level/streak changes)
  checkAchievements();
}

function setHomeTab(tab) {
  const nameIn = $('nameIn');
  if (nameIn) S.name = nameIn.value.trim();
  S.homeTab = tab;
  render('home');
}

function startFromHome(game) {
  const nameIn = $('nameIn');
  if (nameIn) S.name = nameIn.value.trim() || 'Player';
  S.isDaily = false;
  if (game === 'ear') render('ear_level');
  else if (game === 'note') render('note_level');
  else if (game === 'interval') render('interval_level');
  else if (game === 'chord') render('chord_level');
  else if (game === 'piano') render('piano_keys');
  else if (game === 'daily') render('daily');
  else if (game === 'stats') render('stats');
  else if (game === 'wardrobe') render('wardrobe');
  else if (game === 'scales') render('scale_explorer');
  else if (game === 'metronome') render('metronome');
  else if (game === 'rhythm') render('rhythm_level');
  else if (game === 'theory') render('theory_home');
  else if (game === 'achievements') render('achievements');
  else if (game === 'settings') render('settings');
  else if (game === 'sightread') render('sightread_level');
  else if (game === 'songs') render('song_library');
  else if (game === 'exercises') render('exercises_home');
  else if (game === 'hanon') render('hanon');
}

// ── Song Play ──
function startSongPlay(songId) {
  const song = SONG_LIBRARY.find(s => s.id === songId);
  if (!song) return;
  S.currentSong = song;
  S.sightReadLevel = 'song';
  // Create a temporary level entry so the drawing/loop functions can read BPM
  SIGHTREAD_LEVELS.song = { label: song.t, bpm: song.bpm, range: [-21,15], accidentals: true, noteCount: 0 };
  S.sightReadNotes = parseSong(song.s);
  S.sightReadIdx = 0;
  S.sightReadScore = 0;
  S.sightReadDone = false;
  S.songPlayPage = true;
  markGamePlayed('songs');
  render('song_play');
  setTimeout(() => startSightReading(), 200);
}

// ── Exercises ──
function startExercise(grade, num) {
  const ex = GRADE_EXERCISES.find(e => e.g === grade && e.n === num);
  if (!ex) return;
  S.currentExercise = ex;
  S.exQuestionIdx = 0;
  S.exScore = 0;
  S.exDone = false;
  S.exFeedback = null;
  markGamePlayed('exercises');
  render('exercise_play');
}

function answerExercise(answer) {
  const ex = S.currentExercise;
  if (!ex || S.exFeedback) return;
  const q = ex.qs[S.exQuestionIdx];
  if (answer === q.a) {
    S.exScore++;
    S.exFeedback = 'correct';
    sfxCorrect();
  } else {
    S.exFeedback = 'wrong';
    sfxWrong();
  }
  render('exercise_play');
}

function nextExQuestion() {
  S.exQuestionIdx++;
  S.exFeedback = null;
  if (S.exQuestionIdx >= S.currentExercise.qs.length) {
    S.exDone = true;
    if (S.exScore === S.currentExercise.qs.length) addXP(15);
    else addXP(5);
  }
  render('exercise_play');
}

function checkNote() {
  const input = $('noteAns');
  if (!input || !input.value.trim()) return;
  let clean = input.value.toLowerCase().replace(/\s/g, '')
    .replace('doublesharp', '##').replace('doubleflat', 'bb')
    .replace('sharp', '#').replace('flat', 'b');

  // Only replace standalone 'x' with '##' if it follows a letter (e.g., cx → c##)
  clean = clean.replace(/([a-g])x/g, '$1##');

  // Solfège
  const base = clean.replace(/[#b]+$/, '');
  const suffix = clean.slice(base.length);
  if (SOLFEGE[base]) clean = SOLFEGE[base] + suffix;

  if (clean === S.noteFullName) { S.score++; S.noteFeedback = 'correct'; recordCorrectAnswer(); sfxCorrect(); }
  else { S.noteFeedback = 'wrong'; S.noteTip = pick(NOTE_TIPS); sfxWrong(); }
  render('note_play');
}

  else { S.intFeedback = 'wrong'; S.intTip = pick(INTERVAL_TIPS); sfxWrong(); }
  render('interval_play');
}

function chordAnswer(answer) {

function earAnswer(answer) {
  // Level 5: two-note sequence
  if (S.level === '5' && S.earTarget2N != null && S.earStep === 1) {
    const correct1 = S.earTargetFlat ? S.earTargetName+'/'+S.earTargetFlat : S.earTargetName;
    if (answer === correct1) {
      sfxCorrect();
      S.earStep = 2;
      // Build choices for note 2
      const pool = [...PIANO_WHITE, ...PIANO_BLACK];
      const allNames = pool.map(n => n.flat ? n.name+'/'+n.flat : n.name);
      const unique = [...new Set(allNames)];
      const correct2 = S.earTarget2Flat ? S.earTarget2Name+'/'+S.earTarget2Flat : S.earTarget2Name;
      const choices = new Set([correct2]);
      while (choices.size < 6) choices.add(pick(unique));
      S.earChoices = [...choices].sort(() => Math.random() - 0.5);
      render('ear_play');
    } else {
      S.earFeedback = 'wrong'; S.earTip = pick(EAR_TIPS); sfxWrong();
      render('ear_play');
    }
    return;
  }
  if (S.level === '5' && S.earStep === 2) {
    const correct2 = S.earTarget2Flat ? S.earTarget2Name+'/'+S.earTarget2Flat : S.earTarget2Name;
    if (answer === correct2) { S.score++; S.earFeedback = 'correct'; recordCorrectAnswer('_earCorrect'); sfxCorrect(); }
    else { S.earFeedback = 'wrong'; S.earTip = pick(EAR_TIPS); sfxWrong(); }
    render('ear_play');
    return;
  }
  const correct = S.earTargetFlat ? S.earTargetName+'/'+S.earTargetFlat : S.earTargetName;
  if (answer === correct) { S.score++; S.earFeedback = 'correct'; recordCorrectAnswer('_earCorrect'); sfxCorrect(); }
  else { S.earFeedback = 'wrong'; S.earTip = pick(EAR_TIPS); sfxWrong(); }
  render('ear_play');
}

function playScale() {
  const root = SCALE_ROOTS[S.scaleRoot];
  const intervals = SCALE_TYPES[S.scaleType];
  const ctx = getAudioCtx(); ctx.resume();
  const now = ctx.currentTime + 0.05;
  // ascending
  intervals.forEach((semi, i) => {
    makeNote(ctx, noteToFreq(root.n + semi), now + i * 0.35, 0.33, 0.3);
  });
  // descending (skip the top note since it just played)
  const desc = [...intervals].reverse().slice(1);
  desc.forEach((semi, i) => {
    makeNote(ctx, noteToFreq(root.n + semi), now + intervals.length * 0.35 + i * 0.35, 0.33, 0.3);
  });
}

function drawHanonStaff(canvasId, staffNotes, currentIdx) {
  var c = document.getElementById(canvasId);
  if (!c) return;
  var ctx = c.getContext('2d');
  var W = c.width, H = c.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#d4e8fc';
  ctx.fillRect(0, 0, W, H);

  var staffLeft = 20, staffRight = W - 20;
  var LS = 18;
  var bottomLine = H * 0.62;
  function yOf(ht) { return bottomLine - ht * LS; }

  ctx.strokeStyle = '#3a5a7a'; ctx.lineWidth = 1.5;
  for (var i = 0; i < 5; i++) {
    var y = yOf(i);
    ctx.beginPath(); ctx.moveTo(staffLeft, y); ctx.lineTo(staffRight, y); ctx.stroke();
  }

  var ex = HANON_EXERCISES[S.hanonEx];
  var asc = S.hanonBar < HANON_BARS;
  ctx.fillStyle = '#2c5f8a';
  ctx.font = '700 13px Quicksand';
  ctx.textAlign = 'center';
  ctx.fillText('Ex. ' + ex.num + ' \u2014 ' + (asc ? 'Ascending' : 'Descending') + ' bar ' + (asc ? S.hanonBar + 1 : S.hanonBar - HANON_BARS + 1), W / 2, 15);

  var total = staffNotes.length;
  var noteStart = staffLeft + 30;
  var noteEnd = staffRight - 15;
  var gap = total > 1 ? (noteEnd - noteStart) / (total - 1) : 0;
  var NR = 9, NRY = 7, ledgerW = 14;

  staffNotes.forEach(function(note, i) {
    var x = noteStart + i * gap;
    var y = yOf(note.h);

    ctx.strokeStyle = '#3a5a7a'; ctx.lineWidth = 1.5;
    for (var l = -1; note.h <= l; l--) {
      var ly = yOf(l);
      ctx.beginPath(); ctx.moveTo(x - ledgerW, ly); ctx.lineTo(x + ledgerW, ly); ctx.stroke();
    }
    for (var l = 5; note.h >= l; l++) {
      var ly = yOf(l);
      ctx.beginPath(); ctx.moveTo(x - ledgerW, ly); ctx.lineTo(x + ledgerW, ly); ctx.stroke();
    }

    var color = '#1a2a3a';
    if (currentIdx !== undefined && currentIdx !== null) {
      if (i < currentIdx) color = '#4CAF50';
      else if (i === currentIdx && S.hanonPracticing) {
        color = S.hanonErrorFlash ? '#e53935' : '#7c6fef';
      }
    }

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, NR, NRY, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = color;
    ctx.font = '600 10px Quicksand';
    ctx.textAlign = 'center';
    ctx.fillText(note.name, x, y - NRY - 5);

    if (note.finger) {
      ctx.fillStyle = '#6b7fa3';
      ctx.font = '700 11px Quicksand';
      ctx.fillText(note.finger, x, y + NRY + 14);
    }
  });

  if (S.hanonPracticing && currentIdx < total) {
    var cx = noteStart + currentIdx * gap;
    var cy = yOf(staffNotes[currentIdx].h);
    ctx.strokeStyle = S.hanonErrorFlash ? '#e53935' : '#7c6fef';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, NR + 4, NRY + 4, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function hanonPitchLoop() {
  if (!S.hanonPracticing || !micAnalyser) return;
  var now = performance.now();
  if (now - lastDetectTime < 50) { requestAnimationFrame(hanonPitchLoop); return; }
  lastDetectTime = now;

  var buf = new Float32Array(micAnalyser.fftSize);
  micAnalyser.getFloatTimeDomainData(buf);
  var freq = autoCorrelate(buf, getAudioCtx().sampleRate);

  if (freq > 60 && freq < 1500) {
    var noteNum = Math.round(12 * Math.log2(freq / 440));
    var pc = ((noteNum + 9) % 12 + 12) % 12;
    if (pc === stablePc) stableCount++;
    else { stablePc = pc; stableCount = 1; }

    if (stableCount === 3) {
      var barNotes = getHanonBarNotes(S.hanonEx, S.hanonBar);
      if (S.hanonCurrentIdx < barNotes.length) {
        var target = barNotes[S.hanonCurrentIdx];
        var targetPc = ((target.noteNum + 9) % 12 + 12) % 12;

          S.hanonCurrentIdx++;
          S.hanonErrorFlash = false;

                if (S.hanonBar < HANON_BARS * 2 - 1) {
                  S.hanonBar++;
                  S.hanonCurrentIdx = 0;
                  S.hanonCorrect = 0;
                  render('hanon');

                  stopHanonPractice();
                  confetti();
                  addXP(50);
                  var hd = loadScores();
                  hd._hanonCompleted = (hd._hanonCompleted || 0) + 1;
                  try { localStorage.setItem('pms_scores', JSON.stringify(hd)); } catch(e) {}
                  checkAchievements();
                  render('hanon');

              } else {
                drawHanonStaff('hanonStaffCanvas', barNotes, S.hanonCurrentIdx);
                var pt = document.getElementById('hanonPebblesTxt');
                if (pt) pt.textContent = 'Next: ' + barNotes[S.hanonCurrentIdx].name;
              }
            }, 250);
          }
        } else if (!S.hanonErrorFlash) {
          S.hanonErrorFlash = true;
          stablePc = -1; stableCount = 0;
          sfxWrong();
          var canvas = document.getElementById('hanonStaffCanvas');
          if (canvas) {
            drawHanonStaff('hanonStaffCanvas', barNotes, S.hanonCurrentIdx);
            canvas.classList.add('staff-wiggle');
            setTimeout(function() {

              if (canvas) {
                canvas.classList.remove('staff-wiggle');
                drawHanonStaff('hanonStaffCanvas', barNotes, S.hanonCurrentIdx);
              }
            }, 450);
          }
        }
      }
    }
  }
  requestAnimationFrame(hanonPitchLoop);
}

    var pc = ((noteNum + 9) % 12 + 12) % 12;

    else { stablePc = pc; stableCount = 1; }

function autoCorrelate(buf, sampleRate) {
  var rms = 0;
  for (var i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);
  if (rms < 0.012) return -1;

  var SIZE = buf.length;
  var minLag = Math.floor(sampleRate / 1500);
  var maxLag = Math.min(Math.floor(sampleRate / 60), Math.floor(SIZE / 2));

  // Autocorrelation
  var corr = [];
  for (var lag = minLag; lag < maxLag; lag++) {
    var sum = 0;
    for (var j = 0; j < SIZE - lag; j++) sum += buf[j] * buf[j + lag];
    corr.push(sum);
  }

  // Find first dip then best peak after it
  var d = 0;
  while (d < corr.length - 1 && corr[d] >= corr[d + 1]) d++;
  var bestIdx = d, bestVal = corr[d];
  for (var k = d; k < corr.length; k++) {
    if (corr[k] > bestVal) { bestVal = corr[k]; bestIdx = k; }
  }

  var bestLag = minLag + bestIdx;
  if (bestLag <= minLag) return -1;
  return sampleRate / bestLag;
}

function updatePebblesScaleText(staffNotes) {
